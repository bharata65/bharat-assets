<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FOREXAA — Forex Trading Platform</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{--navy:#0f172a;--blue:#2563eb;--green:#059669;--red:#dc2626;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#fff;--shadow:0 12px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--navy)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:900;letter-spacing:.5px}.logo span{color:var(--blue)}
.wrap{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:8px}
.btn{padding:11px 15px;border-radius:11px;font-weight:750}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.light{background:#eef2ff;color:#1e3a8a}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{font-size:13px;font-weight:700;color:#334155;display:block;margin:10px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:13px}
.nav{display:flex;gap:8px;overflow:auto;padding:8px 0}.nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px}
.nav button.active{background:var(--navy);color:#fff}
.hero{padding:45px 20px;text-align:center;background:linear-gradient(135deg,#fff,#eef5ff);border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,7vw,64px);margin:8px 0}.hero p{max-width:720px;margin:0 auto 22px;color:var(--muted)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted)}
.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e2e8f0}.bgreen{background:#dcfce7;color:#166534}.bred{background:#fee2e2;color:#991b1b}.bblue{background:#dbeafe;color:#1e40af}
.side{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:15px;position:sticky;top:64px;height:calc(100vh - 64px)}.sidebar button{display:block;width:100%;text-align:left;background:transparent;padding:11px;border-radius:10px;margin-bottom:4px}.sidebar button:hover,.sidebar button.active{background:#eff6ff;color:#1d4ed8}
.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;color:#fff;padding:13px 16px;border-radius:12px;z-index:99;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}.modalbox{background:#fff;max-width:520px;width:100%;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.qr{display:flex;justify-content:center;padding:15px}.login{max-width:430px;margin:8vh auto}
@media(max-width:850px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr}.sidebar{display:none}.sidebar.mobile{display:block;position:fixed;left:0;top:64px;z-index:30;width:240px}.table{min-width:700px}.card.scroll{overflow:auto}}
@media(max-width:550px){.g4,.g3,.g2{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:14px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCKa0HNQd0kDA8uLP6hNWgkjF70d3wKXbU",
 authDomain:"bharat-digital-assets.firebaseapp.com",
 projectId:"bharat-digital-assets",
 storageBucket:"bharat-digital-assets.firebasestorage.app",
 messagingSenderId:"451769882363",
 appId:"1:451769882363:web:f80db52e495d8456d5425e"
};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const ADMIN_EMAIL="9529951116@forexaa.admin";
let user=null, profile=null, admin=false, page="dashboard", unsub=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(Number(n)||0)}
function toast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function fmt(t){return t?.toDate?t.toDate().toLocaleString():t?new Date(t).toLocaleString():"—"}
function cleanUnsub(){unsub.forEach(x=>x&&x());unsub=[]}

function loginView(msg=""){
 return `<div class="login card"><div class="logo">FOREX<span>AA</span></div><h2>Secure Login</h2><p class="muted">User and administrator authentication</p>
 ${msg?`<div class="card" style="padding:10px;background:#fff7ed">${esc(msg)}</div>`:""}
 <label>Email</label><input id="lemail" type="email" placeholder="you@example.com">
 <label>Password</label><input id="lpass" type="password" placeholder="Password">
 <div class="row" style="margin-top:14px"><button class="btn primary" onclick="doLogin()">Login</button><button class="btn light" onclick="registerUser()">Create account</button></div>
 <p class="muted" style="margin-top:15px">Admin access uses Firebase Authentication. Do not put an admin password in frontend code.</p></div>`;
}
function landing(){
 return `<div class="hero"><div class="logo">FOREX<span>AA</span></div><h1>Trade the markets with clarity.</h1><p>Mobile-first forex dashboard with wallet, KYC, orders, positions and a controlled administration console.</p><button class="btn primary" onclick="showLogin()">Get Started</button></div>
 <div class="wrap"><div class="grid g3"><div class="card"><b>Markets</b><p class="muted">Configurable trading pairs and market status.</p></div><div class="card"><b>Wallet</b><p class="muted">Deposit/withdrawal requests with admin approval.</p></div><div class="card"><b>Security</b><p class="muted">Firebase Authentication, Firestore rules and audit logging.</p></div></div></div>`;
}
function showLogin(){page="login";render()}
window.showLogin=showLogin;

async function doLogin(){
 try{await signInWithEmailAndPassword(auth,$("lemail").value.trim(),$("lpass").value)}catch(e){toast(e.code?.replace("auth/","")||e.message)}
}
async function registerUser(){
 const email=$("lemail").value.trim(),pass=$("lpass").value;
 if(pass.length<6)return toast("Password must be at least 6 characters");
 try{const c=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,email,role:"user",status:"active",balance:0,equity:0,kycStatus:"pending",createdAt:serverTimestamp()});toast("Account created")}catch(e){toast(e.code?.replace("auth/","")||e.message)}
}
window.doLogin=doLogin;window.registerUser=registerUser;

async function loadProfile(){
 if(!user)return;
 const s=await getDoc(doc(db,"users",user.uid));
 profile=s.exists()?s.data():{uid:user.uid,email:user.email,role:"user",balance:0,equity:0};
 admin=profile.role==="admin" || user.email===ADMIN_EMAIL;
}
function shell(){
 return `<div class="top"><div class="logo">FOREX<span>AA</span></div><div class="row"><span class="muted">${esc(user?.email)}</span><button class="btn light" onclick="logout()">Logout</button></div></div>
 <div class="side"><aside class="sidebar" id="sidebar">${(admin?adminNav():userNav())}</aside><main><div class="wrap" id="content"></div></main></div>`;
}
function userNav(){return [["dashboard","Dashboard"],["markets","Markets"],["trade","Trade"],["positions","Positions"],["orders","Orders"],["portfolio","Portfolio"],["wallet","Wallet"],["kyc","KYC"],["transactions","Transactions"],["profile","Profile"],["support","Support"]].map(x=>`<button class="${page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function adminNav(){return [["dashboard","Dashboard"],["users","Users"],["kyc","KYC"],["trades","Trades"],["positions","Positions"],["orders","Orders"],["deposits","Deposits"],["withdrawals","Withdrawals"],["transactions","Transactions"],["pairs","Trading Pairs"],["fees","Fees / Spread"],["notifications","Notifications"],["cms","CMS"],["admins","Admin Users"],["audit","Audit Logs"],["settings","Settings"]].map(x=>`<button class="${page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
window.go=p=>{page=p;renderContent()};window.logout=()=>signOut(auth);

function render(){cleanUnsub();if(!user){$("app").innerHTML=page==="login"?loginView():landing();return}$("app").innerHTML=shell();renderContent()}
function renderContent(){if(!user)return;document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));const c=$("content");if(!c)return;
 const map=admin?adminPages():userPages();c.innerHTML=map[page]||map.dashboard;hookRealtime();}

function userPages(){
 return {
 dashboard:`<h2>Dashboard</h2><div class="grid g4"><div class="card stat"><small>Balance</small><b>${money(profile.balance)}</b></div><div class="card stat"><small>Equity</small><b>${money(profile.equity||profile.balance)}</b></div><div class="card stat"><small>Open P/L</small><b>$0.00</b></div><div class="card stat"><small>KYC</small><b>${esc(profile.kycStatus||"pending")}</b></div></div><div class="card" style="margin-top:16px"><h3>Quick Actions</h3><div class="row"><button class="btn primary" onclick="go('trade')">Open Trade</button><button class="btn light" onclick="go('wallet')">Deposit</button><button class="btn light" onclick="go('wallet')">Withdraw</button></div></div>`,
 markets:`<h2>Markets</h2><div id="marketTable" class="card">Loading markets…</div>`,
 trade:`<h2>Trade</h2><div class="grid g2"><div class="card"><label>Pair</label><select id="tpair"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>USD/INR</option><option>XAU/USD</option></select><label>Side</label><select id="tside"><option>BUY</option><option>SELL</option></select><label>Quantity / Lot</label><input id="tqty" type="number" min=".01" step=".01" value=".01"><label>Stop Loss</label><input id="tsl" type="number" step=".00001"><label>Take Profit</label><input id="ttp" type="number" step=".00001"><button class="btn primary" style="margin-top:12px" onclick="placeTrade()">Submit Order</button></div><div class="card"><h3>Risk Notice</h3><p class="muted">This frontend records orders. Connecting them to a live broker requires a regulated broker/API and server-side execution. Never claim a simulated order is a live market execution.</p></div></div>`,
 positions:`<h2>Positions</h2><div id="positions" class="card">Loading…</div>`,
 orders:`<h2>Orders</h2><div id="orders" class="card">Loading…</div>`,
 portfolio:`<h2>Portfolio</h2><div class="grid g3"><div class="card stat"><small>Cash</small><b>${money(profile.balance)}</b></div><div class="card stat"><small>Positions</small><b id="pc">0</b></div><div class="card stat"><small>Account</small><b>Active</b></div></div>`,
 wallet:`<h2>Wallet</h2><div class="grid g2"><div class="card"><h3>Deposit</h3><label>Amount (USD)</label><input id="depAmount" type="number" min="1" step=".01"><label>Payment UPI ID</label><input id="upiId" placeholder="yourupi@bank"><button class="btn primary" style="margin-top:10px" onclick="createDeposit()">Generate Payment QR</button><div id="qrbox"></div></div><div class="card"><h3>Withdrawal</h3><label>Amount (USD)</label><input id="wdAmount" type="number" min="1" step=".01"><label>UPI ID</label><input id="wdUpi" placeholder="name@upi"><button class="btn danger" style="margin-top:10px" onclick="createWithdrawal()">Request Withdrawal</button><p class="muted">Withdrawals are processed only after admin review.</p></div></div>`,
 kyc:`<h2>KYC</h2><div class="card"><p>Status: <b>${esc(profile.kycStatus||"pending")}</b></p><label>Full Name</label><input id="kycName" value="${esc(profile.fullName||"")}"><label>Document number</label><input id="kycDoc" value=""><button class="btn primary" style="margin-top:10px" onclick="submitKyc()">Submit KYC</button></div>`,
 transactions:`<h2>Transactions</h2><div id="tx" class="card">Loading…</div>`,
 profile:`<h2>Profile</h2><div class="card"><label>Full name</label><input id="pname" value="${esc(profile.fullName||"")}"><button class="btn primary" style="margin-top:10px" onclick="saveProfile()">Save</button></div>`,
 support:`<h2>Support</h2><div class="card"><label>Subject</label><input id="subj"><label>Message</label><textarea id="msg"></textarea><button class="btn primary" style="margin-top:10px" onclick="ticket()">Create Ticket</button></div>`
 }
}
function adminPages(){
 return {
 dashboard:`<h2>Admin Dashboard</h2><div class="grid g4"><div class="card stat"><small>Users</small><b id="acUsers">—</b></div><div class="card stat"><small>Pending Deposits</small><b id="acDep">—</b></div><div class="card stat"><small>Pending Withdrawals</small><b id="acWd">—</b></div><div class="card stat"><small>Open Trades</small><b id="acTrades">—</b></div></div><div class="card" style="margin-top:16px"><h3>Admin controls</h3><p class="muted">All balance changes, approvals and trade actions should be performed through secured server-side endpoints and written to auditLogs.</p></div>`,
 users:`<h2>Users</h2><div id="adminUsers" class="card">Loading…</div>`,
 kyc:`<h2>KYC Review</h2><div id="adminKyc" class="card">Loading…</div>`,
 trades:`<h2>Trades</h2><div id="adminTrades" class="card">Loading…</div>`,
 positions:`<h2>Positions</h2><div id="adminPositions" class="card">Loading…</div>`,
 orders:`<h2>Orders</h2><div id="adminOrders" class="card">Loading…</div>`,
 deposits:`<h2>Deposit Requests</h2><div id="adminDeposits" class="card">Loading…</div>`,
 withdrawals:`<h2>Withdrawal Requests</h2><div id="adminWithdrawals" class="card">Loading…</div>`,
 transactions:`<h2>Transactions</h2><div id="adminTx" class="card">Loading…</div>`,
 pairs:`<h2>Trading Pairs</h2><div class="card"><label>Pair</label><input id="pairName" placeholder="EUR/USD"><label>Bid</label><input id="pairBid" type="number"><label>Ask</label><input id="pairAsk" type="number"><label>Status</label><select id="pairStatus"><option>active</option><option>disabled</option></select><button class="btn primary" style="margin-top:10px" onclick="savePair()">Save Pair</button></div><div id="pairList" class="card" style="margin-top:16px">Loading…</div>`,
 fees:`<h2>Fees / Spread</h2><div class="card"><label>Deposit fee %</label><input id="feeDep" type="number" step=".01"><label>Withdrawal fee %</label><input id="feeWd" type="number" step=".01"><label>Trading commission %</label><input id="feeTrade" type="number" step=".01"><button class="btn primary" style="margin-top:10px" onclick="saveFees()">Save</button></div>`,
 notifications:`<h2>Notifications</h2><div class="card"><label>Title</label><input id="nt"><label>Message</label><textarea id="nm"></textarea><button class="btn primary" style="margin-top:10px" onclick="sendNotice()">Publish</button></div>`,
 cms:`<h2>CMS</h2><div class="card"><label>Hero title</label><input id="cmsTitle" value="Trade the markets with clarity."><label>Hero description</label><textarea id="cmsDesc">Professional trading dashboard.</textarea><button class="btn primary" style="margin-top:10px" onclick="saveCms()">Save</button></div>`,
 admins:`<h2>Admin Users</h2><div class="card"><p>Primary administrator: <b>${ADMIN_EMAIL}</b></p><p class="muted">Create/assign additional admin accounts only with server-side role management.</p></div>`,
 audit:`<h2>Audit Logs</h2><div id="audit" class="card">Loading…</div>`,
 settings:`<h2>Settings</h2><div class="card"><p><b>Project:</b> bharat-digital-assets</p><p><b>Auth:</b> Firebase Authentication</p><p><b>Database:</b> Cloud Firestore</p><p class="muted">Production deployment should use Firebase Security Rules + Cloud Functions/Admin SDK for privileged operations.</p></div>`
 }
}

async function hookRealtime(){
 if(!user)return;
 const watch=(col,cb,filters=[])=>{let q=collection(db,col);if(filters.length)q=query(q,...filters);unsub.push(onSnapshot(q,s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>cb([],e)))};
 if(admin){
  if(page==="users")watch("users",rows=>$("adminUsers").innerHTML=table(rows,["email","role","status","balance","kycStatus"],"userActions"));
  if(page==="kyc")watch("users",rows=>{$("adminKyc").innerHTML=table(rows.filter(x=>x.kycStatus==="pending"),["email","fullName","kycStatus"],"kycActions")});
  if(page==="trades")watch("trades",rows=>$("adminTrades").innerHTML=table(rows,["userId","pair","side","qty","status"],"tradeActions"));
  if(page==="positions")watch("positions",rows=>$("adminPositions").innerHTML=table(rows,["userId","pair","side","qty","status"],"tradeActions"));
  if(page==="orders")watch("orders",rows=>$("adminOrders").innerHTML=table(rows,["userId","pair","side","qty","status"],"orderActions"));
  if(page==="deposits")watch("deposits",rows=>$("adminDeposits").innerHTML=table(rows,["userId","amount","upi","status"],"depositActions"));
  if(page==="withdrawals")watch("withdrawals",rows=>$("adminWithdrawals").innerHTML=table(rows,["userId","amount","upi","status"],"withdrawActions"));
  if(page==="transactions")watch("transactions",rows=>$("adminTx").innerHTML=table(rows,["userId","type","amount","status"],""));
  if(page==="audit")watch("auditLogs",rows=>$("audit").innerHTML=table(rows,["adminUid","action","targetId"],""));
  if(page==="pairs")watch("pairs",rows=>$("pairList").innerHTML=table(rows,["pair","bid","ask","status"],"pairActions"));
  if(page==="dashboard"){
   watch("users",r=>{$("acUsers").textContent=r.length});
   watch("deposits",r=>{$("acDep").textContent=r.filter(x=>x.status==="pending").length});
   watch("withdrawals",r=>{$("acWd").textContent=r.filter(x=>x.status==="pending").length});
   watch("trades",r=>{$("acTrades").textContent=r.filter(x=>x.status==="open").length});
  }
 }else{
  if(page==="markets")watch("pairs",rows=>$("marketTable").innerHTML=table(rows,["pair","bid","ask","status"],""));
  if(page==="positions")watch("positions",rows=>{$("positions").innerHTML=table(rows.filter(x=>x.userId===user.uid),["pair","side","qty","status"],"")});
  if(page==="orders")watch("orders",rows=>{$("orders").innerHTML=table(rows.filter(x=>x.userId===user.uid),["pair","side","qty","status"],"")});
  if(page==="transactions")watch("transactions",rows=>{$("tx").innerHTML=table(rows.filter(x=>x.userId===user.uid),["type","amount","status"],"")});
 }
}
function table(rows,cols,actions){
 if(!rows.length)return `<p class="muted">No records.</p>`;
 return `<div style="overflow:auto"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}<th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join("")}<td>${actions?actionsHtml(actions,r):""}</td></tr>`).join("")}</tbody></table></div>`;
}
function actionsHtml(a,r){
 if(a==="depositActions")return r.status==="pending"?`<button class="btn success" onclick="approveDeposit('${r.id}')">Approve</button> <button class="btn danger" onclick="rejectDoc('deposits','${r.id}')">Reject</button>`:"";
 if(a==="withdrawActions")return r.status==="pending"?`<button class="btn success" onclick="approveWithdrawal('${r.id}')">Approve</button> <button class="btn danger" onclick="rejectDoc('withdrawals','${r.id}')">Reject</button>`:"";
 if(a==="kycActions")return `<button class="btn success" onclick="setKyc('${r.id}','approved')">Approve</button> <button class="btn danger" onclick="setKyc('${r.id}','rejected')">Reject</button>`;
 if(a==="userActions")return `<button class="btn light" onclick="toggleUser('${r.id}','${r.status}')">${r.status==="active"?"Suspend":"Activate"}</button>`;
 if(a==="tradeActions")return r.status==="open"?`<button class="btn danger" onclick="closeTrade('${r.id}')">Close</button>`:"";
 if(a==="orderActions")return r.status==="pending"?`<button class="btn danger" onclick="cancelOrder('${r.id}')">Cancel</button>`:"";
 if(a==="pairActions")return `<button class="btn danger" onclick="deletePair('${r.id}')">Delete</button>`;
 return "";
}

window.placeTrade=async()=>{const pair=$("tpair").value,side=$("tside").value,qty=Number($("tqty").value);if(!qty)return toast("Enter quantity");await addDoc(collection(db,"orders"),{userId:user.uid,pair,side,qty,sl:Number($("tsl").value)||null,tp:Number($("ttp").value)||null,status:"pending",createdAt:serverTimestamp()});toast("Order submitted")};
window.createDeposit=async()=>{
 const amount=Number($("depAmount").value),upi=$("upiId").value.trim();if(!(amount>0)||!upi)return toast("Enter amount and UPI ID");
 const d=await addDoc(collection(db,"deposits"),{userId:user.uid,amount,upi,status:"pending",createdAt:serverTimestamp()});
 $("qrbox").innerHTML=`<div class="card" style="margin-top:12px;text-align:center"><p><b>Payment QR</b></p><div class="qr"><img alt="UPI QR" width="220" height="220" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(`upi://pay?pa=${upi}&pn=FOREXAA&am=${amount.toFixed(2)}&cu=INR&tn=Deposit-${d.id}`)}"></div><p class="muted">Pay exactly ₹${amount.toFixed(2)} to ${esc(upi)}. Admin must verify payment before crediting balance.</p><p>Request ID: ${d.id}</p></div>`;toast("Deposit request created")
};
window.createWithdrawal=async()=>{const amount=Number($("wdAmount").value),upi=$("wdUpi").value.trim();if(!(amount>0)||!upi)return toast("Enter amount and UPI ID");if(amount>Number(profile.balance||0))return toast("Insufficient balance");await addDoc(collection(db,"withdrawals"),{userId:user.uid,amount,upi,status:"pending",createdAt:serverTimestamp()});toast("Withdrawal request submitted")};
window.submitKyc=async()=>{await updateDoc(doc(db,"users",user.uid),{fullName:$("kycName").value.trim(),kycDoc:$("kycDoc").value.trim(),kycStatus:"pending",updatedAt:serverTimestamp()});toast("KYC submitted")};
window.saveProfile=async()=>{await updateDoc(doc(db,"users",user.uid),{fullName:$("pname").value.trim(),updatedAt:serverTimestamp()});profile.fullName=$("pname").value.trim();toast("Profile saved")};
window.ticket=async()=>{await addDoc(collection(db,"tickets"),{userId:user.uid,subject:$("subj").value,message:$("msg").value,status:"open",createdAt:serverTimestamp()});toast("Ticket created")};

async function audit(action,targetId,data={}){await addDoc(collection(db,"auditLogs"),{adminUid:user.uid,action,targetId,data,createdAt:serverTimestamp()})}
window.approveDeposit=async id=>{const s=await getDoc(doc(db,"deposits",id));if(!s.exists())return;const d=s.data();if(d.status!=="pending")return;const u=await getDoc(doc(db,"users",d.userId));if(!u.exists())return;await updateDoc(doc(db,"users",d.userId),{balance:Number(u.data().balance||0)+Number(d.amount),updatedAt:serverTimestamp()});await updateDoc(doc(db,"deposits",id),{status:"approved",approvedBy:user.uid,approvedAt:serverTimestamp()});await addDoc(collection(db,"transactions"),{userId:d.userId,type:"deposit",amount:d.amount,status:"approved",reference:id,createdAt:serverTimestamp()});await audit("approveDeposit",id,{amount:d.amount,userId:d.userId});toast("Deposit approved")};
window.approveWithdrawal=async id=>{const s=await getDoc(doc(db,"withdrawals",id));if(!s.exists())return;const d=s.data();if(d.status!=="pending")return;const u=await getDoc(doc(db,"users",d.userId));if(!u.exists()||Number(u.data().balance||0)<Number(d.amount))return toast("Insufficient user balance");await updateDoc(doc(db,"users",d.userId),{balance:Number(u.data().balance)-Number(d.amount),updatedAt:serverTimestamp()});await updateDoc(doc(db,"withdrawals",id),{status:"approved",approvedBy:user.uid,approvedAt:serverTimestamp()});await addDoc(collection(db,"transactions"),{userId:d.userId,type:"withdrawal",amount:-Number(d.amount),status:"approved",reference:id,createdAt:serverTimestamp()});await audit("approveWithdrawal",id,{amount:d.amount,userId:d.userId});toast("Withdrawal approved")};
window.rejectDoc=async(col,id)=>{await updateDoc(doc(db,col,id),{status:"rejected",rejectedBy:user.uid,rejectedAt:serverTimestamp()});await audit("reject_"+col,id);toast("Rejected")};
window.setKyc=async(id,status)=>{await updateDoc(doc(db,"users",id),{kycStatus:status,updatedAt:serverTimestamp()});await audit("kyc_"+status,id);toast("KYC updated")};
window.toggleUser=async(id,status)=>{const ns=status==="active"?"suspended":"active";await updateDoc(doc(db,"users",id),{status:ns});await audit("user_"+ns,id);toast("User updated")};
window.closeTrade=async id=>{await updateDoc(doc(db,"trades",id),{status:"closed",closedAt:serverTimestamp(),closedBy:user.uid});await audit("closeTrade",id);toast("Trade closed")};
window.cancelOrder=async id=>{await updateDoc(doc(db,"orders",id),{status:"cancelled",cancelledAt:serverTimestamp(),cancelledBy:user.uid});await audit("cancelOrder",id);toast("Order cancelled")};
window.savePair=async()=>{const pair=$("pairName").value.trim();if(!pair)return toast("Pair required");await addDoc(collection(db,"pairs"),{pair,bid:Number($("pairBid").value),ask:Number($("pairAsk").value),status:$("pairStatus").value,updatedAt:serverTimestamp()});toast("Pair saved")};
window.deletePair=async id=>{await deleteDoc(doc(db,"pairs",id));await audit("deletePair",id);toast("Pair deleted")};
window.saveFees=async()=>{await setDoc(doc(db,"settings","fees"),{deposit:Number($("feeDep").value)||0,withdrawal:Number($("feeWd").value)||0,trade:Number($("feeTrade").value)||0,updatedAt:serverTimestamp()});await audit("saveFees","fees");toast("Fees saved")};
window.sendNotice=async()=>{await addDoc(collection(db,"notifications"),{title:$("nt").value,message:$("nm").value,createdAt:serverTimestamp(),createdBy:user.uid});await audit("publishNotification","new");toast("Notification published")};
window.saveCms=async()=>{await setDoc(doc(db,"settings","cms"),{title:$("cmsTitle").value,description:$("cmsDesc").value,updatedAt:serverTimestamp()});await audit("saveCMS","cms");toast("CMS saved")};

onAuthStateChanged(auth,async u=>{user=u;if(u){await loadProfile();page=admin?"dashboard":"dashboard"}render()});
</script>
</body>
</html>
