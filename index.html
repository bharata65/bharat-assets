<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forexaaa — Smart Currency Solutions</title>
<style>
:root{--b:#0757d9;--d:#061b42;--bg:#f5f8ff;--muted:#667085;--card:#fff;--line:#dfe7f5;--ok:#10a66a;--danger:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#14213d}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--b);color:white;font-weight:700}button.alt{background:white;color:var(--b);border:1px solid #cbd8ef}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:900;color:var(--d)}.brand small{display:block;font-size:10px;color:#667085}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{padding:9px 12px}.hero{margin-top:15px;border-radius:20px;overflow:hidden;background:#0b55c7;min-height:220px;display:flex;align-items:center;color:white}.hero img{width:100%;max-height:360px;object-fit:cover;display:block}.hero .copy{padding:35px;max-width:620px}.hero h1{font-size:40px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 5px 20px #123a7a0b}.card h3{margin:0 0 10px}.metric{font-size:25px;font-weight:900;color:var(--d)}.muted{color:var(--muted);font-size:13px}.section{margin-top:25px}.section h2{font-size:21px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.pill{padding:5px 9px;border-radius:999px;background:#e9f1ff;color:var(--b);font-size:12px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--danger)}.modal{position:fixed;inset:0;background:#061b4288;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.on{display:flex}.modalbox{background:white;border-radius:18px;max-width:620px;width:100%;padding:22px;max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #cdd8eb;border-radius:9px;background:white}.qr{width:240px;height:240px;margin:10px auto;display:block;border:8px solid white;box-shadow:0 2px 10px #0002}.toast{position:fixed;right:15px;bottom:15px;background:#071d43;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:40}.toast.on{display:block}.hide{display:none!important}.footer{margin-top:35px;background:#061b42;color:white;padding:30px;border-radius:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.danger{background:var(--danger)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero .copy{padding:22px}.hero{min-height:180px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">F Forexaaa<small>Smart Currency Solutions</small></div><nav class="nav">
<button onclick="show('home')">Home</button><button onclick="show('rates')">Live Rates</button><button onclick="show('converter')">Converter</button><button onclick="show('wallet')">Wallet</button><button onclick="show('deposit')">Deposit</button><button onclick="show('withdraw')">Withdraw</button><button onclick="show('history')">Transactions</button><button onclick="show('profile')">Profile</button><button id="authBtn" class="alt" onclick="openAuth()">Login / Register</button>
</nav></header>

<main id="app"></main>
<footer class="footer"><b>Forexaaa</b> — Smart Currency Solutions<br><span class="muted">Safe, Secure, Smart. Manual payment requests are reviewed by the admin.</span></footer>
</div>

<div id="modal" class="modal"><div class="modalbox" id="modalBody"></div></div><div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,orderBy,onSnapshot,serverTimestamp,limit,getDocs} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCKa0HNQd0kDA8uLP6hNWgkjF70d3wKXbU",authDomain:"bharat-digital-assets.firebaseapp.com",projectId:"bharat-digital-assets",storageBucket:"bharat-digital-assets.firebasestorage.app",messagingSenderId:"451769882363",appId:"1:451769882363:web:f80db52e495d8456d5425e"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,settings={upiId:"forexaaa@upi",upiName:"Forexaaa",minDeposit:100,maxDeposit:100000},wallet=0;
const $=id=>document.getElementById(id), money=n=>"₹ "+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function toast(x){$("toast").textContent=x;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),2600)}
function modal(html){$("modalBody").innerHTML=html;$("modal").classList.add("on")}function closeModal(){$("modal").classList.remove("on")}
window.closeModal=closeModal;
async function loadSettings(){let s=await getDoc(doc(db,"config","public"));if(s.exists())settings={...settings,...s.data()}}
async function ensureProfile(u){let r=doc(db,"users",u.uid),s=await getDoc(r);if(!s.exists())await setDoc(r,{uid:u.uid,email:u.email,name:u.email.split("@")[0],wallet:0,createdAt:serverTimestamp(),status:"Active",kycStatus:"Pending"});else wallet=s.data().wallet||0}
onAuthStateChanged(auth,async u=>{user=u;if(u){await ensureProfile(u);let s=await getDoc(doc(db,"users",u.uid));wallet=s.data()?.wallet||0;$("authBtn").textContent="Logout";$("authBtn").onclick=()=>signOut(auth)}else{$("authBtn").textContent="Login / Register";$("authBtn").onclick=openAuth}show(location.hash.slice(1)||"home")});
window.openAuth=()=>modal(`<h2>Welcome Back</h2><div class="field"><label>Email</label><input id="em" type="email"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button onclick="login()">Login</button> <button class="alt" onclick="register()">Create Account</button><button class="alt" onclick="closeModal()">Close</button>`);
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value);closeModal();toast("Logged in")}catch(e){toast(e.message)}};
window.register=async()=>{try{let c=await createUserWithEmailAndPassword(auth,$("em").value,$("pw").value);await ensureProfile(c.user);closeModal();toast("Account created")}catch(e){toast(e.message)}};
window.show=async p=>{location.hash=p;await loadSettings();let h;
if(p==="home")h=`<section class="hero">${settings.bannerUrl?`<img src="${settings.bannerUrl}" alt="Banner">`:`<div class="copy"><h1>Smart, Secure & Best Forex Rates</h1><p>Currency conversion, wallet and international payment tools in one place.</p><button onclick="show('converter')">Get Started</button></div>`}</section><section class="grid"><div class="card"><div class="muted">Wallet Balance</div><div class="metric">${money(wallet)}</div></div><div class="card"><div class="muted">UPI Deposit</div><div class="metric">${money(settings.minDeposit)}+</div></div><div class="card"><div class="muted">Payment</div><div class="metric">Manual UPI</div></div><div class="card"><div class="muted">Support</div><div class="metric">24/7</div></div></section><section class="section"><h2>Quick Actions</h2><div class="grid"><div class="card"><h3>Deposit Money</h3><p class="muted">Pay using admin-configured UPI QR.</p><button onclick="show('deposit')">Deposit</button></div><div class="card"><h3>Send Money</h3><p class="muted">Create a payout request.</p><button onclick="show('withdraw')">Send</button></div><div class="card"><h3>Live Rates</h3><p class="muted">View configured currency rates.</p><button onclick="show('rates')">View</button></div><div class="card"><h3>Profile</h3><p class="muted">Account and KYC status.</p><button onclick="show('profile')">Open</button></div></div></section>`;
else if(p==="rates")h=`<section class="section"><h2>Live Rates</h2><div id="ratesBox" class="grid"><div class="card">Loading...</div></div></section>`;
else if(p==="converter")h=`<section class="section"><h2>Currency Converter</h2><div class="card"><div class="field"><label>Amount (INR)</label><input id="conv" type="number" value="1000"></div><div class="field"><label>Currency</label><select id="cc"><option>USD</option><option>EUR</option><option>GBP</option><option>AED</option></select></div><button onclick="convert()">Convert</button><div id="convout" class="metric" style="margin-top:15px"></div></div></section>`;
else if(p==="wallet")h=`<section class="section"><h2>Wallet</h2><div class="grid"><div class="card"><div class="muted">Main Wallet</div><div class="metric">${money(wallet)}</div><button onclick="show('deposit')">Deposit</button> <button class="alt" onclick="show('withdraw')">Withdraw</button></div></div></section>`;
else if(p==="deposit")h=`<section class="section"><h2>Manual Payment Gateway (UPI QR)</h2><div class="card"><p class="muted">UPI ID: <b>${settings.upiId}</b> · ${settings.upiName||""}</p><div class="field"><label>Deposit Amount (INR)</label><input id="depAmt" type="number" min="${settings.minDeposit}" max="${settings.maxDeposit}" placeholder="Enter amount"></div><button onclick="makeQR()">Generate QR</button><div id="qrArea"></div></div></section>`;
else if(p==="withdraw")h=`<section class="section"><h2>Withdraw</h2><div class="card"><div class="muted">Available balance</div><div class="metric">${money(wallet)}</div><div class="field"><label>Amount</label><input id="wdAmt" type="number"></div><div class="field"><label>UPI ID / Bank details</label><input id="wdTo" placeholder="Enter UPI ID or account details"></div><button onclick="withdraw()">Submit Withdrawal</button></div></section>`;
else if(p==="history")h=`<section class="section"><h2>Transaction History</h2><div id="hist" class="card">Loading...</div></section>`;
else if(p==="profile")h=`<section class="section"><h2>Profile</h2><div class="card"><div id="prof">Loading...</div></div></section>`;
else h=`<section class="section"><h2>Forexaaa</h2><div class="card">Page not found.</div></section>`;
$("app").innerHTML=h;if(p==="rates")loadRates();if(p==="history")loadHistory();if(p==="profile")loadProfile();};
async function loadRates(){let q=await getDocs(collection(db,"rates")),x="";q.forEach(d=>{let r=d.data();x+=`<div class="card"><b>${r.currency||d.id}</b><div>Buy: ${r.buy||"-"}</div><div>Sell: ${r.sell||"-"}</div><span class="pill">${r.status||"Active"}</span></div>`});$("ratesBox").innerHTML=x||`<div class="card">No rates configured yet.</div>`}
window.convert=async()=>{let c=$("cc").value,a=+$("conv").value,q=query(collection(db,"rates"),where("currency","==",c),limit(1)),s=await getDocs(q);let r=s.docs[0]?.data();$("convout").textContent=r?`${c} ${ (a/Number(r.sell||1)).toFixed(2)}`:"Rate unavailable"};
window.makeQR=()=>{if(!user)return openAuth();let a=+$("depAmt").value;if(!a||a<settings.minDeposit||a>settings.maxDeposit)return toast(`Amount must be between ${money(settings.minDeposit)} and ${money(settings.maxDeposit)}`);let upi=`upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent(settings.upiName||"Forexaaa")}&am=${a.toFixed(2)}&cu=INR`;modal(`<h2>Pay ${money(a)}</h2><p>Scan this UPI QR and complete payment.</p><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(upi)}"><p><b>UPI ID:</b> ${settings.upiId}</p><button onclick="submitDeposit(${a})">I Have Paid</button><button class="alt" onclick="closeModal()">Cancel</button>`)}
window.submitDeposit=async a=>{try{let ref=await addDoc(collection(db,"deposits"),{uid:user.uid,email:user.email,amount:a,method:"UPI QR",upiId:settings.upiId,status:"Pending",createdAt:serverTimestamp()});await addDoc(collection(db,"notifications"),{uid:user.uid,title:"Deposit submitted",message:`Deposit ${money(a)} is pending admin verification.`,read:false,createdAt:serverTimestamp()});closeModal();toast("Deposit submitted for verification");show("history")}catch(e){toast(e.message)}};
window.withdraw=async()=>{if(!user)return openAuth();let a=+$("wdAmt").value,to=$("wdTo").value.trim();if(!a||a<=0||a>wallet||!to)return toast("Enter valid amount and payout details");await addDoc(collection(db,"withdrawals"),{uid:user.uid,email:user.email,amount:a,to,status:"Pending",createdAt:serverTimestamp()});toast("Withdrawal request submitted");show("history")};
async function loadHistory(){if(!user){$("hist").innerHTML="Please login to view transactions.";return}let out="",dq=query(collection(db,"deposits"),where("uid","==",user.uid),orderBy("createdAt","desc"),limit(30));let d=await getDocs(dq);d.forEach(x=>{let r=x.data();out+=`<div class="row"><span>Deposit · ${money(r.amount)}<small class="muted"> ${r.method||""}</small></span><b>${r.status}</b></div>`});let wq=query(collection(db,"withdrawals"),where("uid","==",user.uid),orderBy("createdAt","desc"),limit(30));let w=await getDocs(wq);w.forEach(x=>{let r=x.data();out+=`<div class="row"><span>Withdrawal · ${money(r.amount)}</span><b>${r.status}</b></div>`});$("hist").innerHTML=out||"No transactions yet."}
async function loadProfile(){if(!user){$("prof").innerHTML="Please login.";return}let s=(await getDoc(doc(db,"users",user.uid))).data();$("prof").innerHTML=`<p><b>Name:</b> ${s.name||"-"}</p><p><b>Email:</b> ${s.email}</p><p><b>Wallet:</b> ${money(s.wallet)}</p><p><b>KYC:</b> <span class="pill">${s.kycStatus||"Pending"}</span></p><p><b>Account:</b> ${s.status||"Active"}</p>`}
</script>
</body></html>
