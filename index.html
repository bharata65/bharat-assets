<style>

weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;outline:none;background:#fff}.modal{position:fixed;inset:0;background:#071d4166;display:grid;place-items:center;z-index:100;padding:18px}.modalbox{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px}.toast{position:fixed;right:20px;bottom:20px;background:#10213e;color:#fff;padding:13px 17px;border-radius:10px;z-index:200;box-shadow:0 10px 30px #0003}.empty{text-align:center;padding:35px;color:var(--muted)}.hero{min-height:190px;border-radius:18px;padding:25px;color:white;background:linear-gradient(120deg,#083b9a,#0b6ff5);display:flex;align-items:end;background-size:cover;background-position:center}.rate{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#8a5a00;font-size:13px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#fff);padding:20px}..loginbox{width:min(430px,100%);background:white;border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 15px 50px #17345a14}.brandmark{width:55px;height:55px;border-radius:15px;background:#075bd8;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;margin-bottom:15px}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}
@media(max-width:700px){.top{padding:0 12px}.top .search{display:none}.side{display:none}.main{margin:0;width:100%;padding:14px}.g4,.g3,.g2,.formgrid{grid-template-columns:1fr}.title h1{font-size:21px}.mobilebar{display:flex!important}.hero{min-height:160px}.mobilebar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:8px}.mobilebar button{border:0;background:none;color:#617086;font-size:11px}.mobilebar button.active{color:var(--blue);font-weight:700}.main{padding-bottom:80px}}
.mobilebar{display:none}
</style>

<body>
<div id="root"></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,addDoc,collection,query,where,getDocs,updateDoc,orderBy,serverTimestamp,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyCKa0HNQd0kDA8uLP6hNWgkjF70d3wKXbU",authDomain:"bharat-digital-assets.firebaseapp.com",projectId:"bharat-digital-assets",storageBucket:"bharat-digital-assets.firebasestorage.app",messagingSenderId:"451769882363",appId:"1:451769882363:web:f80db52e495d8456d5425e"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id); const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0);
let user=null,profile=null,view="home",unsub=null;

const navItems=[["home","⌂","Home"],["rates","↗","Live Rates"],["converter","⇄","Converter"],["send","➤","Send Money"],["wallet","▣","Wallet"],["transactions","≡","Transactions"],["market","◈","Market"],["portfolio","◉","Portfolio"],["insights","▤","Insights"],["signals","⚡","Signals"],["referrals","♧","Referral"],["rewards","★","Rewards"],["notifications","●","Notifications"],["support","?","Support"],["profile","●","Profile"]];
function toast(x){$("toast").textContent=x;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function modal(html){$("modalContent").innerHTML=html;$("modal").classList.remove("hidden")} function closeModal(){$("modal").classList.add("hidden")}
window.closeModal=closeModal;
function nav(v){view=v;render();scrollTo(0,0)}
async function userDoc(){let s=await getDoc(doc(db,"users",user.uid));return s.exists()?s.data():null}
async function settings(){let s=await getDoc(doc(db,"settings","public"));return s.exists()?s.data():{siteName:"Forexaaaa",upiId:"forexaaaa@upi",upiName:"Forexaaaa Payments",upiEnabled:true,bankName:"Demo Bank",accountName:"Forexaaaa Payments",accountNumber:"0000000000",ifsc:"DEMO0000000",heroImage:"",heroTitle:"Smart, Secure & Best Forex Rates"}}
async function rates(){let q=await getDocs(collection(db,"rates"));return q.docs.map(x=>({id:x.id,...x.data()}))}
async function wallets(){let s=await getDoc(doc(db,"wallets",user.uid));return s.exists()?s.data():{balance:0,pending:0,bonus:0}}
async function txns(){let q=query(collection(db,"transactions"),where("userId","==",user.uid));let s=await getDocs(q);return s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))}
function shell(content){
return `<div class="app"><header class="top"><div><div class="logo">F<span>orexaaaa</span></div><div class="tag">Smart Currency Solutions</div></div><input class="search" placeholder="Search..." oninput="filterText(this.value)"><div class="avatar">${(profile?.name||"U")[0].toUpperCase()}</div><button class="btn secondary" onclick="logout()">Logout</button></header><div class="layout"><aside class="side">${navItems.map(n=>`<button class="nav ${view==n[0]?'active':''}" onclick="nav('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")}</aside><main class="main">${content}</main></div><nav class="mobilebar">${navItems.slice(0,5).map(n=>`<button class="${view==n[0]?'active':''}" onclick="nav('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join("")}</nav></div>`}
async function render(){if(!user){renderLogin();return} profile=await userDoc(); if(!profile){await setDoc(doc(db,"users",user.uid),{email:user.email,name:user.email.split("@")[0],phone:"",role:"user",status:"active",kycStatus:"NOT_SUBMITTED",createdAt:serverTimestamp()});profile=await userDoc()} let c=await views();$("root").innerHTML=shell(c)}
function renderLogin(){ $("root").innerHTML=`<div class="login"><div class="loginbox"><div class="brandmark">F</div><h1>Welcome Back</h1><p class="muted">Login to your Forexaaaa account</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="••••••••"></div><button class="btn" style="width:100%" onclick="login()">Login</button><p style="text-align:center">Don't have an account? <a href="#" onclick="register();return false">Register</a></p><div class="notice">Demo only: no OTP or phone verification is used.</div></div></div>`}
async function login(){try{await signInWithEmailAndPassword(auth,$("email").value,$("pass").value);toast("Login successful")}catch(e){toast(e.message)}}
async function register(){modal(`<h2>Create Account</h2><div class="field"><label>Name</label><input id="rname"></div><div class="field"><label>Email</label><input id="remail" type="email"></div><div class="field"><label>Phone</label><input id="rphone"></div><div class="field"><label>Password</label><input id="rpass" type="password"></div><button class="btn" onclick="doRegister()">Create Account</button>`)}
async function doRegister(){try{let c=await createUserWithEmailAndPassword(auth,$("remail").value,$("rpass").value);await setDoc(doc(db,"users",c.user.uid),{name:$("rname").value,email:c.user.email,phone:$("rphone").value,role:"user",status:"active",kycStatus:"NOT_SUBMITTED",createdAt:serverTimestamp()});await setDoc(doc(db,"wallets",c.user.uid),{balance:0,pending:0,bonus:0});closeModal();toast("Account created")}catch(e){toast(e.message)}}
async function logout(){await signOut(auth)}
window.login=login;window.register=register;window.doRegister=doRegister;window.logout=logout;window.nav=nav;window.toast=toast;
async function views(){
if(view==="home"){let w=await wallets(),r=await rates(),s=await settings(),t=await txns();return `<div class="title"><div><h1>Hello, ${profile?.name||"User"} 👋</h1><span class="muted">Welcome to Forexaaaa</span></div><div class="actions"><button class="btn" onclick="nav('deposit')">+ Add Money</button><button class="btn secondary" onclick="nav('send')">Send Money</button></div></div><div class="hero" style="${s.heroImage?`background-image:linear-gradient(90deg,#083b9acc,#075bd888),url('${s.heroImage}')`:''}"><div><h2>${s.heroTitle||"Smart, Secure & Best Forex Rates"}</h2><p>Safe, simple and transparent currency solutions.</p></div></div><br><div class="grid g4"><div class="card balance"><span class="muted">Total Balance</span><div class="big">${money(w.balance)}</div><small>Available balance</small></div><div class="card"><span class="muted">Pending</span><div class="big">${money(w.pending)}</div><span class="muted">Under verification</span></div><div class="card"><span class="muted">Bonus Wallet</span><div class="big">${money(w.bonus)}</div><span class="muted">Rewards & bonuses</span></div><div class="card"><span class="muted">KYC Status</span><div class="big" style="font-size:22px">${profile?.kycStatus||"NOT_SUBMITTED"}</div><button class="btn secondary" onclick="nav('profile')">View Profile</button></div></div><br><div class="grid g2"><div class="card"><div class="row"><h3>Live Market</h3><button class="btn secondary" onclick="nav('rates')">See All</button></div>${r.slice(0,6).map(x=>`<div class="rate"><b>${x.id}/INR</b><span>${x.buy} / ${x.sell}</span><span class="${Number(x.change)>=0?'success':'danger'}">${x.change||0}%</span></div>`).join("")}</div><div class="card"><div class="row"><h3>Recent Transactions</h3><button class="btn secondary" onclick="nav('transactions')">View All</button></div>${t.slice(0,5).map(tx=>`<div class="rate"><span>${tx.type}</span><b>${money(tx.amount)}</b><span class="badge">${tx.status}</span></div>`).join("")||'<div class="empty">No transactions yet</div>'}</div></div>`}
if(view==="rates"){let r=await rates();return page("Live Rates",`<div class="card"><div class="field"><input class="search" placeholder="Search currency" oninput="searchRates(this.value)"></div><div class="tablewrap"><table class="table"><thead><tr><th>Currency</th><th>Buy</th><th>Sell</th><th>Change</th></tr></thead><tbody id="ratesBody">${r.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.buy}</td><td>${x.sell}</td><td class="${Number(x.change)>=0?'success':'danger'}">${x.change||0}%</td></tr>`).join("")}</tbody></table></div></div>`)}
if(view==="converter"){let r=await rates();return page("Currency Converter",`<div class="card" style="max-width:650px"><div class="formgrid"><div class="field"><label>You Send</label><input id="camount" type="number" value="1000"></div><div class="field"><label>From</label><select id="cfrom">${r.map(x=>`<option>${x.id}</option>`).join("")}</select></div><div class="field"><label>You Get</label><input id="cget" readonly></div><div class="field"><label>To</label><select id="cto"><option>INR</option>${r.map(x=>`<option>${x.id}</option>`).join("")}</select></div></div><button class="btn" onclick="convert()">Convert Now</button><div id="convResult" style="margin-top:15px"></div></div>`)}
if(view==="send")return page("Send Money",`<div class="card" style="max-width:650px"><div class="field"><label>Recipient Name</label><input id="recipient"></div><div class="field"><label>Receiving Method</label><select id="method"><option>Bank Transfer</option><option>Wallet</option></select></div><div class="field"><label>Amount (INR)</label><input id="sendAmount" type="number"></div><button class="btn" onclick="reviewSend()">Review & Continue</button></div>`);
if(view==="wallet"){let w=await wallets();return page("Wallet",`<div class="grid g3"><div class="card balance"><span class="muted">Main Wallet</span><div class="big">${money(w.balance)}</div></div><div class="card"><span class="muted">Pending</span><div class="big">${money(w.pending)}</div></div><div class="card"><span class="muted">Bonus</span><div class="big">${money(w.bonus)}</div></div></div><br><div class="actions"><button class="btn" onclick="nav('deposit')">Deposit</button><button class="btn secondary" onclick="nav('withdraw')">Withdraw</button><button class="btn secondary" onclick="nav('transactions')">Transaction History</button></div>`)}
if(view==="deposit")return depositView();
if(view==="withdraw")return withdrawView();
if(view==="transactions"){let t=await txns();return page("Transaction History",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${t.map(x=>`<tr><td>${x.id.slice(0,10)}</td><td>${x.type}</td><td>${money(x.amount)}</td><td><span class="badge">${x.status}</span></td><td>${x.createdAt?.toDate?.().toLocaleString?.()||""}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No transactions</td></tr>'}</tbody></table></div>`)}
if(view==="profile")return profileView();
if(view==="notifications"){let q=query(collection(db,"notifications"),where("userId","==",user.uid));let s=await getDocs(q);return page("Notifications",`<div class="grid g2">${s.docs.map(x=>{let n=x.data();return `<div class="card"><b>${n.title}</b><p>${n.message}</p><span class="muted">${n.createdAt?.toDate?.().toLocaleString?.()||""}</span></div>`}).join("")||'<div class="empty">No notifications</div>'}</div>`)}
if(view==="support")return page("Customer Support",`<div class="card" style="max-width:700px"><h3>Raise a Ticket</h3><div class="field"><label>Subject</label><input id="tsub"></div><div class="field"><label>Category</label><select id="tcat"><option>Payment</option><option>Account</option><option>KYC</option><option>Transaction</option></select></div><div class="field"><label>Message</label><textarea id="tmsg" rows="5"></textarea></div><button class="btn" onclick="ticket()">Submit Ticket</button></div>`);
if(view==="market")return page("Market Overview",`<div class="grid g3">${["NIFTY","SENSEX","DOW JONES","GOLD","SILVER"].map((x,i)=>`<div class="card"><span class="muted">${x}</span><div class="big">${[22315,7312,38670,72640,97500][i].toLocaleString()}</div><span class="${i%2?'danger':'success'}">${i%2?'-0.35%':'+1.20%'}</span></div>`).join("")}</div>`);
if(view==="portfolio")return page("Portfolio",`<div class="grid g2"><div class="card"><span class="muted">Total Investment</span><div class="big">₹2,50,000</div><span class="success">+₹5,410 (+4.30%)</span></div><div class="card"><h3>Allocation</h3><canvas id="chart" height="200"></canvas></div></div>`);
if(view==="insights")return page("Market Insights",`<div class="grid g3"><div class="card"><h3>Economic Calendar</h3><p>Major economic events and updates.</p></div><div class="card"><h3>Economic News</h3><p>Latest currency-market information.</p></div><div class="card"><h3>Daily Insights</h3><p>Informational market insights.</p></div></div>`);
if(view==="signals")return page("Signals",`<div class="grid g3">${["EUR/USD","GBP/USD","USD/JPY"].map((x,i)=>`<div class="card"><span class="muted">${x}</span><h2 class="success">${i===1?"SELL":"BUY"}</h2><p>Demo/informational signal</p><span class="muted">Not financial advice</span></div>`).join("")}</div>`);
if(view==="referrals")return page("Referral & Earn",`<div class="card"><h3>Your Referral Code</h3><div class="big">${(profile?.name||"USER").replace(/\\s/g,"").toUpperCase().slice(0,8)}01</div><button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('.big').textContent);toast('Copied')">Copy Code</button></div>`);
if(view==="rewards")return page("Rewards",`<div class="grid g2"><div class="card"><span class="muted">Your Points</span><div class="big">2,450</div></div><div class="card"><h3>Redeem History</h3><p class="muted">No rewards redeemed yet.</p></div></div>`);
if(view==="profile")return profileView();
return page(view[0].toUpperCase()+view.slice(1),`<div class="card empty">This section is ready for your content and Firebase data.</div>`);
}
function page(t,c){return `<div class="title"><h1>${t}</h1></div>${c}`}
async function depositView(){let s=await settings();return page("Add Money",`<div class="grid g2"><div class="card"><h3>UPI Payment</h3><p class="muted">Manual verification. Payment is credited only after admin approval.</p><div class="field"><label>Amount</label><input id="damt" type="number" min="1" placeholder="₹5,000"></div><button class="btn" ${s.upiEnabled===false?"disabled":""} onclick="showUpi()">Pay via UPI QR</button></div><div class="card"><h3>Bank Transfer</h3><p class="muted">Use bank details configured by admin.</p><button class="btn secondary" onclick="showBank()">Bank Transfer</button></div></div>`)}
async function showUpi(){let amt=Number($("damt").value),s=await settings();if(!amt)return toast("Enter amount");let upi=`upi://pay?pa=${encodeURIComponent(s.upiId)}&pn=${encodeURIComponent(s.upiName)}&am=${amt.toFixed(2)}&cu=INR`;modal(`<h2>Pay ₹${amt.toLocaleString("en-IN")} via UPI</h2><p><b>${s.upiName}</b><br>UPI ID: ${s.upiId}</p><div style="text-align:center"><div id="qr" style="display:inline-block;padding:10px"></div></div><div class="notice">Scan this QR, complete the payment in your UPI app, then click “I Have Paid”. Admin will manually verify it.</div><br><button class="btn secondary" onclick="navigator.clipboard.writeText('${s.upiId}');toast('UPI ID copied')">Copy UPI ID</button> <a class="btn" href="${upi}">Open UPI App</a><br><br><button class="btn success" onclick="submitDeposit(${amt},'UPI')">I Have Paid</button></div>`);await loadQR(upi)}
async function loadQR(text){let sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";sc.onload=()=>new QRCode($("qr"),{text,width:210,height:210});document.head.appendChild(sc)}
async function submitDeposit(amount,method,utr=""){let ref=await addDoc(collection(db,"deposits"),{userId:user.uid,amount,method,status:"PENDING",utr,createdAt:serverTimestamp()});await addDoc(collection(db,"transactions"),{userId:user.uid,type:"DEPOSIT",amount,status:"PENDING",depositId:ref.id,createdAt:serverTimestamp()});await setDoc(doc(db,"wallets",user.uid),{pending:amount},{merge:true});closeModal();toast("Deposit submitted for verification")}
async function showBank(){let s=await settings();modal(`<h2>Bank Transfer</h2><p><b>${s.accountName}</b><br>${s.bankName}<br>Account: ${s.accountNumber}<br>IFSC: ${s.ifsc}</p><div class="field"><label>Amount</label><input id="bamt" type="number"></div><div class="field"><label>UTR / Reference Number</label><input id="utr"></div><button class="btn" onclick="submitBank()">I Have Paid</button>`)}
async function submitBank(){let a=Number($("bamt").value),u=$("utr").value;if(!a||!u)return toast("Enter amount and UTR");await submitDeposit(a,"BANK",u);closeModal()}
async function withdrawView(){let w=await wallets();return page("Withdraw",`<div class="card" style="max-width:650px"><p class="muted">Available Balance</p><div class="big">${money(w.balance)}</div><div class="field"><label>Amount</label><input id="wamt" type="number"></div><div class="field"><label>Bank Account</label><input id="wbank" placeholder="Bank account / IFSC"></div><button class="btn" onclick="withdraw()">Submit Withdrawal</button></div>`)}
async function withdraw(){let a=Number($("wamt").value),w=await wallets();if(!a||a>w.balance)return toast("Invalid amount");await addDoc(collection(db,"withdrawals"),{userId:user.uid,amount:a,bank:$("wbank").value,status:"PENDING",createdAt:serverTimestamp()});await addDoc(collection(db,"transactions"),{userId:user.uid,type:"WITHDRAWAL",amount:a,status:"PENDING",createdAt:serverTimestamp()});await setDoc(doc(db,"wallets",user.uid),{balance:w.balance-a,pending:(w.pending||0)+a},{merge:true});toast("Withdrawal submitted");nav("transactions")}
async function reviewSend(){let a=Number($("sendAmount").value),r=$("recipient").value,m=$("method").value;if(!a||!r)return toast("Enter recipient and amount");modal(`<h2>Review Transfer</h2><p>Recipient: <b>${r}</b></p><p>Method: ${m}</p><p>Amount: <b>${money(a)}</b></p><button class="btn" onclick="sendMoney('${r}','${m}',${a})">Confirm Send</button>`)}
async function sendMoney(recipient,method,amount){let w=await wallets();if(amount>w.balance)return toast("Insufficient balance");await addDoc(collection(db,"transfers"),{userId:user.uid,recipient,method,amount,status:"PENDING",createdAt:serverTimestamp()});await addDoc(collection(db,"transactions"),{userId:user.uid,type:"SEND MONEY",amount,status:"PENDING",createdAt:serverTimestamp()});await setDoc(doc(db,"wallets",user.uid),{balance:w.balance-amount},{merge:true});closeModal();toast("Transfer submitted");nav("transactions")}
async function ticket(){if(!$("tsub").value||!$("tmsg").value)return toast("Fill all fields");await addDoc(collection(db,"tickets"),{userId:user.uid,subject:$("tsub").value,category:$("tcat").value,message:$("tmsg").value,status:"OPEN",createdAt:serverTimestamp()});toast("Ticket created")}
async function profileView(){return page("Profile",`<div class="grid g2"><div class="card"><h3>Personal Details</h3><div class="field"><label>Name</label><input id="pname" value="${profile?.name||""}"></div><div class="field"><label>Phone</label><input id="pphone" value="${profile?.phone||""}"></div><button class="btn" onclick="saveProfile()">Save Changes</button></div><div class="card"><h3>Verification</h3><p>KYC: <span class="badge">${profile?.kycStatus||"NOT_SUBMITTED"}</span></p><button class="btn secondary" onclick="kyc()">KYC Verification</button><hr><h3>Security</h3><p class="muted">Email login enabled. No OTP in this demo.</p></div></div>`)}
async function saveProfile(){await updateDoc(doc(db,"users",user.uid),{name:$("pname").value,phone:$("pphone").value});profile=await userDoc();toast("Profile updated");render()}
async function kyc(){modal(`<h2>KYC Verification</h2><div class="field"><label>Full Name</label><input id="kname" value="${profile?.name||""}"></div><div class="field"><label>DOB</label><input id="kdob" type="date"></div><div class="field"><label>PAN</label><input id="kpan"></div><div class="field"><label>Government ID</label><input id="kid"></div><div class="field"><label>Document</label><input id="kfile" type="file" accept=".jpg,.jpeg,.png,.pdf"></div><button class="btn" onclick="submitKyc()">Submit KYC</button>`)}
async function submitKyc(){let file=$("kfile").files[0],url="";if(file){let r=ref(storage,`kyc/${user.uid}/${Date.now()}-${file.name}`);await uploadBytes(r,file);url=await getDownloadURL(r)}await setDoc(doc(db,"kyc",user.uid),{userId:user.uid,name:$("kname").value,dob:$("kdob").value,pan:$("kpan").value,governmentId:$("kid").value,documentUrl:url,status:"PENDING",createdAt:serverTimestamp()});await updateDoc(doc(db,"users",user.uid),{kycStatus:"PENDING"});closeModal();toast("KYC submitted")}
async function convert(){let a=Number($("camount").value),from=$("cfrom").value,to=$("cto").value,r=await rates(),x=r.find(z=>z.id===from);let val=to==="INR"?a*Number(x?.sell||1):a; $("cget").value=val.toFixed(2);$("convResult").innerHTML=`<div class="notice">Demo conversion rate applied. Result: <b>${val.toFixed(2)} ${to}</b></div>`}
function searchRates(v){document.querySelectorAll("#ratesBody tr").forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(v.toLowerCase())?"":"none")}
function filterText(v){}
window.showUpi=showUpi;window.submitDeposit=submitDeposit;window.showBank=showBank;window.submitBank=submitBank;window.withdraw=withdraw;window.reviewSend=reviewSend;window.sendMoney=sendMoney;window.ticket=ticket;window.saveProfile=saveProfile;window.kyc=kyc;window.submitKyc=submitKyc;window.convert=convert;window.searchRates=searchRates;window.filterText=filterText;
onAuthStateChanged(auth,async u=>{user=u;if(unsub){unsub();unsub=null}await render();if(u)unsub=onSnapshot(doc(db,"users",u.uid),()=>render())});
</script>
</body>
</html>
