    // 3. Helper Functions: Toast, QR Generator, Formatting
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-red-600 text-white border-red-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-900 text-white border-slate-800'
      };
      toast.className = `p-3.5 rounded-2xl shadow-xl border flex items-center space-x-3 text-sm font-medium pointer-events-auto fade-enter ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span class="flex-1">${message}</span>
        <button onclick="this.parentElement.remove()" class="p-1 hover:opacity-75"><i data-lucide="x" class="w-4 h-4"></i></button>
      `;
      container.appendChild(toast);
      if (typeof lucide !== 'undefined') lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    window.formatINR = function(val) {
      if (val === undefined || val === null || isNaN(val)) return '₹0.00';
      return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    window.toggleMoreSheet = function(show) {

      } else {
        backdrop.classList.add('hidden');
      }
    };

    window.copyToClipboard = function(text, label = 'Copied') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copied to clipboard!`, 'success');
      }).catch(() => {
        showToast('Failed to copy to clipboard', 'error');
      });
    };

    // 4. Firebase Sync & Real-time Listeners
    function setupRealtimeListeners(uid) {
      if (!db || !uid) return;

      // Sync User Profile
      onSnapshot(doc(db, "users", uid), (docSnap) => {
        if (docSnap.exists()) {
          window.AppState.userProfile = docSnap.data();
          updateHeaderUI();
        }
      });

      // Sync Wallet
      onSnapshot(doc(db, "wallets", uid), (docSnap) => {
        if (docSnap.exists()) {
          window.AppState.wallet = docSnap.data();
        } else {
          // Initialize default wallet in firestore
          setDoc(doc(db, "wallets", uid), window.AppState.wallet);
        }
      });

      // Sync Payment Settings (Controlled by Admin)
      onSnapshot(doc(db, "settings", "payment"), (docSnap) => {
        if (docSnap.exists()) {
          window.AppState.paymentSettings = { ...window.AppState.paymentSettings, ...docSnap.data() };

          setDoc(doc(db, "settings", "payment"), window.AppState.paymentSettings);
        }
      });

      // Sync User Deposits
      const depQ = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("createdAt", "desc"), limit(25));
      onSnapshot(depQ, (snap) => {
        window.AppState.deposits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }, (err) => console.log("Deposit listener offline mode:", err.message));

      // Sync User Positions
      const posQ = query(collection(db, "positions"), where("uid", "==", uid), where("status", "==", "open"));
      onSnapshot(posQ, (snap) => {
        window.AppState.openPositions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }, (err) => console.log("Positions offline mode"));

      const hash = window.location.hash || '#/home';
      const outlet = document.getElementById('view-outlet');

      // Update Back Button visibility
      if (hash === '#/home' || hash === '#/landing' || hash === '' || hash === '#/') {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      // Update Bottom Navigation Active State
      ['home', 'markets', 'trade', 'portfolio'].forEach(key => {
        const item = document.getElementById(`nav-item-${key}`);
        if (item) {
          if (hash.startsWith(`#/${key}`)) {
            item.classList.add('text-brand-600', 'font-bold');
            item.classList.remove('text-slate-500');
          } else {
            item.classList.remove('text-brand-600', 'font-bold');
            item.classList.add('text-slate-500');
          }
        }

      // Route Dispatcher (All 28 Views + Secure Admin route)
      if (hash.startsWith('#/secure-admin') || hash.startsWith('#/admin')) {

    window.executeOrder = async function(symbol, side, lots, price, margin) {
      document.getElementById('modal-outlet').classList.add('hidden');
      
      const newPos = {
        positionId: 'POS-' + Math.random().toString(36).substr(2, 8).toUpperCase(),
        symbol,
        side,
        quantity: lots,
        entryPrice: parseFloat(price),
        margin: parseFloat(margin),
        fees: 10.00,
        status: 'open',
        createdAt: new Date().toISOString()
      };

      // Add to local state
      window.AppState.openPositions.push(newPos);
      window.AppState.wallet.availableBalance -= parseFloat(margin);
      window.AppState.wallet.lockedBalance += parseFloat(margin);

      // Store in Firestore if available
      if (db && window.AppState.currentUser) {
        try {
          await addDoc(collection(db, "positions"), {
            ...newPos,
            uid: window.AppState.currentUser.uid
          });
        } catch (e) {
          console.log("Firestore position offline synced");
        }
      }

      showToast(`Position opened successfully for ${symbol}!`, 'success');
      window.location.hash = '#/positions';
    };

    window.setDepositAmount = function(amt) {

    window.initDepositQR = function() {
      const amountInput = document.getElementById('deposit-amount');
      const qrContainer = document.getElementById('upi-qrcode');
      const intentBtn = document.getElementById('upi-intent-btn');
      if (!qrContainer) return;

      const amt = amountInput ? amountInput.value : '500';
      const upiId = window.AppState.paymentSettings.upiId;
      const upiName = window.AppState.paymentSettings.upiName;
      
      // Standard Dynamic UPI Payment URI
      const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(upiName)}&am=${amt}&cu=INR&tn=FOREXAA_Deposit`;

      qrContainer.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, {
          text: upiUri,
          width: 140,
          height: 140,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      } else {
        qrContainer.innerHTML = `<p class="text-xs font-mono text-slate-400">QR Generator Ready</p>`;
      }

      if (intentBtn) {
        intentBtn.href = upiUri;
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    window.submitDepositRequest = async function() {
      const amt = document.getElementById('deposit-amount')?.value;
      const utr = document.getElementById('deposit-utr')?.value.trim();

      if (!amt || parseFloat(amt) < window.AppState.paymentSettings.minimumDeposit) {
        return showToast(`Minimum deposit is ₹${window.AppState.paymentSettings.minimumDeposit}`, 'error');
      }
      if (!utr || utr.length < 8) {
        return showToast('Please enter a valid 12-digit UPI UTR number', 'error');
      }

      const depositData = {
        depositId: 'DEP-' + Math.random().toString(36).substr(2, 8).toUpperCase(),
        amount: parseFloat(amt),
        currency: 'INR',
        upiId: window.AppState.paymentSettings.upiId,
        utr: utr,
        status: 'pending', // Pending Admin review
        createdAt: new Date().toISOString()
      };

      if (db && window.AppState.currentUser) {
        try {
          await addDoc(collection(db, "deposits"), {
            ...depositData,
            uid: window.AppState.currentUser.uid
          });
        } catch (e) {
          console.log("Firestore deposit queue simulated");
        }
      }

      window.AppState.deposits.unshift(depositData);
      showToast('Deposit request submitted! Admin will verify UTR shortly.', 'success');
      window.location.hash = '#/wallet';
    };

    // ==========================================
    // SECURE ADMIN AUTHORIZATION & AUDIT ENGINE
    // ==========================================
    async function requireAdmin() {
      const user = window.AppState.currentUser;
      if (!user) return false;

      // Check current profile cache
      if (window.AppState.userProfile && window.AppState.userProfile.role === 'admin' && window.AppState.userProfile.status === 'active') {
        return true;
      }

      // Live Firestore verification
      if (db) {
        try {
          const userDocRef = doc(db, "users", user.uid);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) {
            const data = snap.data();
            window.AppState.userProfile = data;
            if (data.role === 'admin' && data.status === 'active') {
              return true;
            }
          }
        } catch (err) {
          console.error("Firestore Admin Verification Error:", err);
        }
      }
      return false;
    }

    async function logAdminAction(action, targetType, targetId, reason = 'Admin Action', before = null, after = null) {
      const user = window.AppState.currentUser;
      const logEntry = {
        adminUid: user ? user.uid : 'system',
        adminEmail: user ? user.email : 'system@forexaa.com',
        action,
        targetType,
        targetId,
        reason,
        before,
        after,
        timestamp: new Date().toISOString()
      };

      if (!window.AppState.auditLogs) window.AppState.auditLogs = [];
      window.AppState.auditLogs.unshift(logEntry);

      if (db) {
        try {
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
          await setDoc(doc(db, "auditLogs", logId), logEntry);
        } catch (e) {
          console.warn("Audit log offline sync");
        }
      }
    }

    window.handleAdminLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-auth-email').value.trim();
      const pass = document.getElementById('admin-auth-password').value;
      const btn = document.getElementById('admin-login-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">⟳</span> Verifying Credentials...`;

      try {
        if (auth) {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          const snap = db ? await getDoc(doc(db, "users", cred.user.uid)) : null;
          const profile = snap && snap.exists() ? snap.data() : null;

          if (profile && profile.role === 'admin' && profile.status === 'active') {
            window.AppState.currentUser = cred.user;
            window.AppState.userProfile = profile;
            await logAdminAction('ADMIN_LOGIN_SUCCESS', 'auth', cred.user.uid, 'Successful administrator sign-in');
            showToast('Admin access authorized. Welcome to FOREXAA Control Desk.', 'success');
            renderAdminControlCenter('#/secure-admin/dashboard');
          } else {
            // Not an admin role
            await signOut(auth);
            showToast('Access Denied: Account is not provisioned with administrative privileges.', 'error');
            btn.disabled = false;
            btn.innerHTML = `Authenticate & Access Desk`;
          }
        } else {
          // Demo simulation mode
          if (email.includes('admin')) {
            window.AppState.currentUser = { uid: 'admin-demo-uid', email };
            window.AppState.userProfile = { uid: 'admin-demo-uid', email, fullName: 'Super Admin', role: 'admin', status: 'active', kycStatus: 'verified' };
            await logAdminAction('ADMIN_LOGIN_DEMO', 'auth', 'admin-demo-uid', 'Admin demo login');
            showToast('Admin desk authenticated (Demo Mode)', 'success');
            renderAdminControlCenter('#/secure-admin/dashboard');
          } else {
            showToast('Access Denied: Email not recognized as administrator.', 'error');
            btn.disabled = false;
            btn.innerHTML = `Authenticate & Access Desk`;
          }
        }
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
        btn.disabled = false;
        btn.innerHTML = `Authenticate & Access Desk`;
      }
    };

    // Admin Action Handlers with Audit Logging
    window.adminSavePaymentSettings = async function(e) {
      e.preventDefault();
      const upiId = document.getElementById('admin-upi-id').value.trim();
      const upiName = document.getElementById('admin-upi-name').value.trim();
      const minDep = parseFloat(document.getElementById('admin-min-dep').value);
      const maxDep = parseFloat(document.getElementById('admin-max-dep').value);
      const inst = document.getElementById('admin-pay-inst').value.trim();
      const upiEnabled = document.getElementById('admin-upi-enabled').checked;
      const qrEnabled = document.getElementById('admin-qr-enabled').checked;

      const before = { ...window.AppState.paymentSettings };
      const newSettings = {
        upiId,
        upiName,
        minimumDeposit: minDep,
        maximumDeposit: maxDep,
        paymentInstructions: inst,
        upiEnabled,
        qrEnabled
      };

      window.AppState.paymentSettings = newSettings;

      if (db) {
        try {
          await setDoc(doc(db, "settings", "payment"), newSettings);
        } catch (err) {
          console.warn("Offline payment settings update");
        }
      }

      await logAdminAction('UPDATE_PAYMENT_SETTINGS', 'settings', 'payment', 'Updated UPI ID and deposit limits', before, newSettings);
      showToast('Payment settings broadcasted to all users successfully!', 'success');
      renderAdminControlCenter('#/secure-admin/payment-settings');
    };

    window.adminApproveDeposit = async function(depId, amount) {
      const dep = window.AppState.deposits.find(d => d.depositId === depId);
      if (dep) {
        if (dep.status === 'approved') {
          return showToast('This deposit is already approved!', 'error');
        }

        dep.status = 'approved';
        window.AppState.wallet.tradingBalance += amount;
        window.AppState.wallet.availableBalance += amount;

        if (db) {
          try {
            await setDoc(doc(db, "deposits", depId), { status: 'approved', approvedAt: new Date().toISOString() }, { merge: true });
            await setDoc(doc(db, "wallets", dep.uid || 'demo-user'), { 
              tradingBalance: window.AppState.wallet.tradingBalance,
              availableBalance: window.AppState.wallet.availableBalance 
            }, { merge: true });
          } catch (e) {
            console.warn("Offline deposit update");
          }
        }

        await logAdminAction('APPROVE_DEPOSIT', 'deposit', depId, `Approved ₹${amount} for trader deposit`);
        showToast(`Deposit ${depId} approved & credited ₹${amount} to trader wallet!`, 'success');
        renderAdminControlCenter('#/secure-admin/deposits');
      }
    };

    window.adminPromptRejectDeposit = function(depId) {
      const reason = prompt('Please enter the reason for rejection (e.g. Invalid UTR / Payment not received):');
      if (reason !== null) {
        adminRejectDeposit(depId, reason || 'UTR verification failed');
      }
    };

    window.adminRejectDeposit = async function(depId, reason) {
      const dep = window.AppState.deposits.find(d => d.depositId === depId);
      if (dep) {
        dep.status = 'rejected';
        dep.rejectionReason = reason;

        if (db) {
          try {
            await setDoc(doc(db, "deposits", depId), { status: 'rejected', rejectionReason: reason, rejectedAt: new Date().toISOString() }, { merge: true });
          } catch (e) {
            console.warn("Offline rejection update");
          }
        }

        await logAdminAction('REJECT_DEPOSIT', 'deposit', depId, reason);
        showToast(`Deposit ${depId} marked as rejected.`, 'error');
        renderAdminControlCenter('#/secure-admin/deposits');
      }
    };

    window.adminEmergencyClosePosition = async function(posId) {
      const pos = window.AppState.openPositions.find(p => (p.positionId || p.id) === posId);
      window.AppState.openPositions = window.AppState.openPositions.filter(p => (p.positionId || p.id) !== posId);

      if (db) {
        try {
          await deleteDoc(doc(db, "positions", posId));
        } catch (e) {
          console.warn("Offline position close");
        }
      }

      await logAdminAction('EMERGENCY_CLOSE_POSITION', 'position', posId, 'Position closed by admin desk risk intervention', pos, null);
      showToast(`Position ${posId} closed by Risk Desk intervention.`, 'info');
      renderAdminControlCenter('#/secure-admin/trades');
    };

    // Initialize Application on DOM Ready
    document.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('hashchange', renderCurrentRoute);
      if (!window.location.hash) {
        window.location.hash = '#/home';
      } else {
        renderCurrentRoute();
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
