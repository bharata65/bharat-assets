<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forexaaaa Admin Panel</title>
<style>
:root{--blue:#075bd8;--dark:#071d41;--bg:#f5f8fc;--card:#fff;--muted:#718096;--green:#10a66a;--red:#e5484d;--orange:#f59e0b;--border:#e5eaf2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#14213d}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:16px;position:sticky;top:0;z-index:20}.logo{font-size:24px;font-weight:800;color:var(--dark)}.logo span{color:var(--blue)}.tag{font-size:11px;color:var(--muted)}.top .search{margin-left:auto;max-width:340px}.search,.field input,.field select,.field textarea{border:1px solid var(--border);background:#fff;border-radius:10px;padding:11px 13px;outline:none;width:100%}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;color:var(--blue);font-weight:800}.layout{display:flex}.side{width:245px;position:fixed;top:68px;bottom:0;background:#fff;border-right:1px solid var(--border);padding:15px 12px;overflow:auto}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;color:#526174;margin:2px 0}.nav.active,.nav:hover{background:#eaf2ff;color:var(--blue);font-weight:700}.main{margin-left:245px;padding:24px;width:calc(100% - 245px);max-width:1700px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title h1{margin:0}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:17px;box-shadow:0 4px 18px #172b4d0a}.stat .num{font-size:26px;font-weight:800;margin:7px 0}.muted{font-size:13px;color:var(--muted)}.btn{border:0;background:var(--blue);color:white;border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#edf4ff;color:var(--blue)}.btn.success{background:var(--green)}.btn.danger{background:var(--red)}.btn.warn{background:var(--orange)}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;white-space:nowrap}.table th{color:var(--muted)}.badge{padding:5px 8px;border-radius:99px;background:#eef2f7;font-size:10px;font-weight:800}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.modal{position:fixed;inset:0;background:#071d4166;display:grid;place-items:center;padding:18px;z-index:100}.modalbox{width:min(600px,100%);background:#fff;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eef2f7;border-radius:50%;width:33px;height:33px}.toast{position:fixed;right:20px;bottom:20px;background:#10213e;color:#fff;padding:13px 17px;border-radius:10px;z-index:200}.notice{padding:12px;background:#fff7e6;border-radius:10px;color:#8a5a00;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#fff);padding:20px}.loginbox{width:min(420px,100%);background:white;border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 15px 50px #17345a14}.brandmark{width:55px;height:55px;background:#075bd8;color:#fff;border-radius:15px;display:grid;place-items:center;font-size:25px;font-weight:900}
@media(max-width:1050px){.g4{grid-template-columns:1fr 1fr}.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:700px){.side{display:none}.main{margin:0;width:100%;padding:14px}.g4,.g3,.g2{grid-template-columns:1fr}.top .search{display:none}.title h1{font-size:21px}}
</style>
</head>
<body>
<div id="root"></div><div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast hidden"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,updateDoc,addDoc,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCKa0HNQd0kDA8uLP6hNWgkjF70d3wKXbU",authDomain:"bharat-digital-assets.firebaseapp.com",projectId:"bharat-digital-assets",storageBucket:"bharat-digital-assets.firebasestorage.app",messagingSenderId:"451769882363",appId:"1:451769882363:web:f80db52e495d8456d5425e"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=x=>document.getElementById(x);const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(n)||0);let admin=null,view="dashboard";
const items=[["dashboard","▦","Dashboard"],["users","●","User Management"],["kyc","✓","KYC Management"],["wallets","▣","Wallet Management"],["deposits","↓","Deposit Management"],["withdrawals","↑","Withdrawal Management"],["transactions","≡","Transaction Management"],["currencies","◎","Currency Management"],["rates","↗","Rates Management"],["charges","%","Margin & Charges"],["transfers","➤","Send Money"],["gateways","▣","Payment Gateways"],["support","?","Support & Tickets"],["notifications","●","Notifications"],["cms","▤","CMS Management"],["blog","▤","Blog Management"],["referrals","♧","Referral & Rewards"],["reports","◈","Reports & Analytics"],["settings","⚙","System Settings"],["logs","≡","Activity Logs"]];
function toast(x){$("toast").textContent=x;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2500)}function modal(h){$("modalContent").innerHTML=h;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}window.closeModal=closeModal;
function nav(v){view=v;render()}window.nav=nav;
async function getCol(name){let s=await getDocs(collection(db,name));return s.docs.map(x=>({id:x.id,...x.data()}))}
async function log(action,target=""){await addDoc(collection(db,"activityLogs"),{adminId:admin.uid,action,target,createdAt:serverTimestamp()})}
function shell(c){return `<header class="top"><div><div class="logo">F<span>orexaaaa</span></div><div class="tag">Admin Control Center</div></div><input class="search" placeholder="Search..."><div class="avatar">A</div><button class="btn secondary" onclick="logout()">Logout</button></header><div class="layout"><aside class="side">${items.map(i=>`<button class="nav ${view===i[0]?'active':''}" onclick="nav('${i[0]}')">${i[1]} &nbsp; ${i[2]}</button>`).join("")}</aside><main class="main">${c}</main></div>`}
function login(){ $("root").innerHTML=`<div class="login"><div class="loginbox"><div class="brandmark">F</div><h1>Admin Login</h1><p class="muted">Forexaaaa administration</p><div class="field"><label>Email</label><input id="email" value="admin@forexaaaa.com"></div><div class="field"><label>Password</label><input id="pass" type="password" value="ChangeMe123!"></div><button class="btn" style="width:100%" onclick="doLogin()">Login</button><p class="muted">Create this admin account in Firebase Authentication first, then assign role=admin in Firestore.</p></div></div>`}
async function doLogin(){try{await signInWithEmailAndPassword(auth,$("email").value,$("pass").value)}catch(e){toast(e.message)}}async function logout(){await signOut(auth)}window.doLogin=doLogin;window.logout=logout;
async function isAdmin(){let s=await getDoc(doc(db,"users",admin.uid));return s.exists()&&(s.data().role==="admin"||s.data().role==="super_admin")}
async function render(){if(!admin){login();return}if(!(await isAdmin())){$("root").innerHTML=`<div class="login"><div class="loginbox"><h2>Access denied</h2><p>Your Firebase account is not assigned an admin role.</p><button class="btn" onclick="logout()">Logout</button></div></div>`;return}let c=await views();$("root").innerHTML=shell(c)}
function page(t,c){return `<div class="title"><h1>${t}</h1><span class="muted">Forexaaaa Admin Panel</span></div>${c}`}
async function views(){
if(view==="dashboard"){let [u,d,w,t]=await Promise.all([getCol("users"),getCol("deposits"),getCol("withdrawals"),getCol("transactions")]);let dep=d.reduce((a,x)=>a+Number(x.amount||0),0),wd=w.reduce((a,x)=>a+Number(x.amount||0),0);return page("Dashboard",`<div class="grid g4"><div class="card stat"><span class="muted">Total Users</span><div class="num">${u.length}</div></div><div class="card stat"><span class="muted">Total Deposits</span><div class="num">${money(dep)}</div></div><div class="card stat"><span class="muted">Total Withdrawals</span><div class="num">${money(wd)}</div></div><div class="card stat"><span class="muted">Total Transactions</span><div class="num">${t.length}</div></div></div><br><div class="grid g2"><div class="card"><h3>Deposit Overview</h3><canvas id="depChart" height="180"></canvas></div><div class="card"><h3>Recent Activity</h3>${(await getCol("activityLogs")).slice(-8).reverse().map(x=>`<p><b>${x.action}</b><br><span class="muted">${x.target||""}</span></p>`).join("")||'<p class="muted">No activity</p>'}</div></div>`)}
if(view==="users"){let u=await getCol("users");return page("User Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>KYC</th><th>Action</th></tr></thead><tbody>${u.map(x=>`<tr><td>${x.name||""}</td><td>${x.email||""}</td><td>${x.phone||""}</td><td>${x.status||""}</td><td>${x.kycStatus||""}</td><td><button class="btn secondary" onclick="editUser('${x.id}')">Edit</button></td></tr>`).join("")}</tbody></table></div>`)}
if(view==="kyc"){let k=await getCol("kyc");return page("KYC Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>User</th><th>Name</th><th>PAN</th><th>Status</th><th>Document</th><th>Action</th></tr></thead><tbody>${k.map(x=>`<tr><td>${x.userId}</td><td>${x.name||""}</td><td>${x.pan||""}</td><td><span class="badge">${x.status}</span></td><td>${x.documentUrl?`<a href="${x.documentUrl}" target="_blank">View</a>`:"-"}</td><td><button class="btn success" onclick="kycAction('${x.id}','${x.userId}','VERIFIED')">Approve</button> <button class="btn danger" onclick="kycReject('${x.id}','${x.userId}')">Reject</button></td></tr>`).join("")}</tbody></table></div>`)}
if(view==="deposits"){let d=await getCol("deposits");return page("Deposit Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Method</th><th>UTR</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.userId.slice(0,10)}</td><td>${money(x.amount)}</td><td>${x.method}</td><td>${x.utr||"-"}</td><td>${x.status}</td><td>${x.status==="PENDING"?`<button class="btn success" onclick="approveDeposit('${x.id}')">Approve</button> <button class="btn danger" onclick="rejectDeposit('${x.id}')">Reject</button>`:"-"}</td></tr>`).join("")}</tbody></table></div>`)}
if(view==="withdrawals"){let d=await getCol("withdrawals");return page("Withdrawal Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Bank</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.userId.slice(0,10)}</td><td>${money(x.amount)}</td><td>${x.bank||"-"}</td><td>${x.status}</td><td>${x.status==="PENDING"?`<button class="btn success" onclick="withdrawAction('${x.id}','APPROVED')">Approve</button> <button class="btn danger" onclick="withdrawAction('${x.id}','REJECTED')">Reject</button>`:"-"}</td></tr>`).join("")}</tbody></table></div>`)}
if(view==="transactions"){let t=await getCol("transactions");return page("Transaction Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${t.map(x=>`<tr><td>${x.id.slice(0,10)}</td><td>${x.userId}</td><td>${x.type}</td><td>${money(x.amount)}</td><td>${x.status}</td></tr>`).join("")}</tbody></table></div>`)}
if(view==="wallets"){let w=await getCol("wallets");return page("Wallet Management",`<div class="card tablewrap"><table class="table"><thead><tr><th>User</th><th>Balance</th><th>Pending</th><th>Bonus</th><th>Action</th></tr></thead><tbody>${w.map(x=>`<tr><td>${x.id}</td><td>${money(x.balance)}</td><td>${money(x.pending)}</td><td>${money(x.bonus)}</td><td><button class="btn secondary" onclick="adjustWallet('${x.id}')">Adjust</button></td></tr>`).join("")}</tbody></table></div>`)}
if(view==="rates"){let r=await getCol("rates");return page("Rates Management",`<div class="actions"><button class="btn" onclick="addRate()">+ Add Currency</button></div><br><div class="card tablewrap"><table class="table"><thead><tr><th>Currency</th><th>Buy</th><th>Sell</th><th>Change</th><th>Action</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.id}</td><td>${x.buy}</td><td>${x.sell}</td><td>${x.change||0}%</td><td><button class="btn secondary" onclick="editRate('${x.id}')">Edit</button></td></tr>`).join("")}</tbody></table></div>`)}
if(view==="currencies")return page("Currency Management",`<div class="card"><p class="muted">Currencies are managed through the Rates collection. Add/edit them from Rates Management.</p><button class="btn" onclick="nav('rates')">Open Rates</button></div>`);
if(view==="charges"){let s=await getSettings();return page("Margin & Charges",`<div class="card" style="max-width:650px"><div class="field"><label>Conversion Fee %</label><input id="fee" value="${s.conversionFee||0}"></div><div class="field"><label>Withdrawal Fee</label><input id="wfee" value="${s.withdrawalFee||0}"></div><div class="field"><label>Deposit Fee</label><input id="dfee" value="${s.depositFee||0}"></div><button class="btn" onclick="saveCharges()">Save Charges</button></div>`)}
if(view==="gateways"){let s=await getSettings();return page("Payment Gateways",`<div class="card" style="max-width:700px"><h3>Manual UPI</h3><div class="field"><label>UPI ID</label><input id="upi" value="${s.upiId||""}"></div><div class="field"><label>Display Name</label><input id="upiname" value="${s.upiName||""}"></div><div class="field"><label>UPI Enabled</label><select id="upien"><option value="true" ${s.upiEnabled!==false?"selected":""}>Enabled</option><option value="false" ${s.upiEnabled===false?"selected":""}>Disabled</option></select></div><hr><h3>Bank Transfer</h3><div class="field"><label>Account Name</label><input id="aname" value="${s.accountName||""}"></div><div class="field"><label>Bank Name</label><input id="bname" value="${s.bankName||""}"></div><div class="field"><label>Account Number</label><input id="anum" value="${s.accountNumber||""}"></div><div class="field"><label>IFSC</label><input id="ifsc" value="${s.ifsc||""}"></div><button class="btn" onclick="saveGateway()">Save Payment Settings</button></div>`)}
if(view==="notifications")return page("Notifications",`<div class="card" style="max-width:650px"><div class="field"><label>User ID (blank = all users)</label><input id="nid"></div><div class="field"><label>Title</label><input id="ntitle"></div><div class="field"><label>Message</label><textarea id="nmsg"></textarea></div><button class="btn" onclick="sendNotification()">Send Notification</button></div>`);
if(view==="support"){let t=await getCol("tickets");return page("Support & Tickets",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Subject</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody>${t.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.userId}</td><td>${x.subject}</td><td>${x.category}</td><td>${x.status}</td><td><button class="btn secondary" onclick="replyTicket('${x.id}')">Reply</button></td></tr>`).join("")}</tbody></table></div>`)}
if(view==="logs"){let l=await getCol("activityLogs");return page("Activity Logs",`<div class="card tablewrap"><table class="table"><thead><tr><th>Action</th><th>Target</th><th>Admin</th><th>Date</th></tr></thead><tbody>${l.reverse().map(x=>`<tr><td>${x.action}</td><td>${x.target||""}</td><td>${x.adminId}</td><td>${x.createdAt?.toDate?.().toLocaleString?.()||""}</td></tr>`).join("")}</tbody></table></div>`)}
if(view==="reports"){let [u,d,w,t]=await Promise.all([getCol("users"),getCol("deposits"),getCol("withdrawals"),getCol("transactions")]);return page("Reports & Analytics",`<div class="grid g4"><div class="card stat"><span class="muted">Users</span><div class="num">${u.length}</div></div><div class="card stat"><span class="muted">Deposits</span><div class="num">${money(d.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card stat"><span class="muted">Withdrawals</span><div class="num">${money(w.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card stat"><span class="muted">Transactions</span><div class="num">${t.length}</div></div></div><br><button class="btn" onclick="exportData()">Export JSON Backup</button>`)}
if(view==="settings"){let s=await getSettings();return page("System Settings",`<div class="card" style="max-width:700px"><div class="field"><label>Site Name</label><input id="site" value="${s.siteName||"Forexaaaa"}"></div><div class="field"><label>Hero Title</label><input id="heroTitle" value="${s.heroTitle||""}"></div><div class="field"><label>Home Banner Image URL</label><input id="hero" value="${s.heroImage||""}" placeholder="Firebase Storage download URL"></div><div class="field"><label>Support Email</label><input id="supportEmail" value="${s.supportEmail||""}"></div><button class="btn" onclick="saveSettings()">Save Settings</button><div class="notice" style="margin-top:15px">For your home banner, upload the image to Firebase Storage and paste its download URL here. Recommended desktop banner: 1600×500 px; mobile-safe composition: keep important content centered.</div></div>`)}
if(view==="cms")return page("CMS Management",`<div class="card"><p>Use System Settings for the main banner and global settings. Additional CMS fields can be added to the same Firestore document.</p></div>`);
if(view==="blog")return page("Blog Management",`<div class="card"><p>Create blog posts in a future posts collection. The two-file architecture keeps the UI simple while Firestore stores the content.</p></div>`);
if(view==="referrals")return page("Referral & Rewards",`<div class="card" style="max-width:600px"><p class="muted">Configure referral values in the settings document.</p><button class="btn" onclick="toast('Referral configuration can be added to settings')">Configure</button></div>`);
if(view==="transfers"){let t=await getCol("transfers");return page("Send Money / Payout Requests",`<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Recipient</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${t.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.userId}</td><td>${x.recipient}</td><td>${money(x.amount)}</td><td>${x.status}</td><td>${x.status==="PENDING"?`<button class="btn success" onclick="transferAction('${x.id}','COMPLETED')">Complete</button> <button class="btn danger" onclick="transferAction('${x.id}','REJECTED')">Reject</button>`:"-"}</td></tr>`).join("")}</tbody></table></div>`)}
return page(items.find(x=>x[0]===view)?.[2]||"Module",`<div class="card empty">Module is ready. Use Firebase-backed data and add its configuration from the relevant control page.</div>`);
}
async function getSettings(){let s=await getDoc(doc(db,"settings","public"));return s.exists()?s.data():{}}
async function approveDeposit(id){let d=await getDoc(doc(db,"deposits",id));if(!d.exists()||d.data().status!=="PENDING")return toast("Already processed");let x=d.data(),w=await getDoc(doc(db,"wallets",x.userId)),old=w.exists()?w.data():{balance:0,pending:0,bonus:0};await updateDoc(doc(db,"deposits",id),{status:"APPROVED",approvedAt:serverTimestamp(),approvedBy:admin.uid});await setDoc(doc(db,"wallets",x.userId),{balance:Number(old.balance||0)+Number(x.amount),pending:Math.max(0,Number(old.pending||0)-Number(x.amount))},{merge:true});let q=await getDocs(query(collection(db,"transactions"),where("depositId","==",id)));for(let z of q.docs)await updateDoc(z.ref,{status:"SUCCESS"});await addDoc(collection(db,"notifications"),{userId:x.userId,title:"Deposit Approved",message:`Your ${money(x.amount)} deposit was approved.`,type:"SUCCESS",createdAt:serverTimestamp()});await log("Deposit approved",id);toast("Deposit approved");render()}
async function rejectDeposit(id){let reason=prompt("Rejection reason?")||"Payment not verified";let d=await getDoc(doc(db,"deposits",id));if(!d.exists()||d.data().status!=="PENDING")return toast("Already processed");let x=d.data();await updateDoc(doc(db,"deposits",id),{status:"REJECTED",rejectionReason:reason});let q=await getDocs(query(collection(db,"transactions"),where("depositId","==",id)));for(let z of q.docs)await updateDoc(z.ref,{status:"REJECTED"});await setDoc(doc(db,"wallets",x.userId),{pending:0},{merge:true});await addDoc(collection(db,"notifications"),{userId:x.userId,title:"Deposit Rejected",message:reason,type:"ERROR",createdAt:serverTimestamp()});await log("Deposit rejected",id);toast("Deposit rejected");render()}
async function withdrawAction(id,status){let s=await getDoc(doc(db,"withdrawals",id));if(!s.exists()||s.data().status!=="PENDING")return toast("Already processed");let x=s.data();await updateDoc(doc(db,"withdrawals",id),{status,processedAt:serverTimestamp(),processedBy:admin.uid});if(status==="REJECTED"){let w=await getDoc(doc(db,"wallets",x.userId)),old=w.data();await setDoc(doc(db,"wallets",x.userId),{balance:Number(old.balance||0)+Number(x.amount),pending:Math.max(0,Number(old.pending||0)-Number(x.amount))},{merge:true})}await addDoc(collection(db,"notifications"),{userId:x.userId,title:"Withdrawal Update",message:`Withdrawal ${status}.`,type:status==="APPROVED"?"SUCCESS":"ERROR",createdAt:serverTimestamp()});await log(`Withdrawal ${status}`,id);toast("Updated");render()}
async function kycAction(id,uid,status){await updateDoc(doc(db,"kyc",id),{status});await updateDoc(doc(db,"users",uid),{kycStatus:status});await addDoc(collection(db,"notifications"),{userId:uid,title:"KYC Update",message:`Your KYC status is ${status}.`,createdAt:serverTimestamp()});await log("KYC approved",uid);render()}
async function kycReject(id,uid){let r=prompt("Reason?")||"Document verification failed";await updateDoc(doc(db,"kyc",id),{status:"REJECTED",reason:r});await updateDoc(doc(db,"users",uid),{kycStatus:"REJECTED"});await addDoc(collection(db,"notifications"),{userId:uid,title:"KYC Rejected",message:r,createdAt:serverTimestamp()});await log("KYC rejected",uid);render()}
async function editUser(id){let u=await getDoc(doc(db,"users",id));let x=u.data();modal(`<h2>Edit User</h2><div class="field"><label>Name</label><input id="un" value="${x.name||""}"></div><div class="field"><label>Phone</label><input id="up" value="${x.phone||""}"></div><div class="field"><label>Status</label><select id="us"><option ${x.status==="active"?"selected":""}>active</option><option ${x.status==="suspended"?"selected":""}>suspended</option></select></div><button class="btn" onclick="saveUser('${id}')">Save</button>`)}
async function saveUser(id){await updateDoc(doc(db,"users",id),{name:$("un").value,phone:$("up").value,status:$("us").value});await log("User updated",id);closeModal();render()}
async function adjustWallet(id){let a=Number(prompt("Adjustment amount (+/- INR)")||0),reason=prompt("Reason")||"Admin adjustment";if(!a)return;let w=await getDoc(doc(db,"wallets",id)),x=w.exists()?w.data():{balance:0,pending:0,bonus:0},before=Number(x.balance||0),after=before+a;if(after<0)return toast("Cannot make balance negative");await setDoc(doc(db,"wallets",id),{balance:after},{merge:true});await addDoc(collection(db,"transactions"),{userId:id,type:"ADMIN_ADJUSTMENT",amount:Math.abs(a),status:"SUCCESS",description:reason,createdAt:serverTimestamp()});await log("Wallet adjusted",id);toast("Wallet updated");render()}
async function editRate(id){let r=await getDoc(doc(db,"rates",id)),x=r.data();modal(`<h2>Edit ${id}</h2><div class="field"><label>Buy</label><input id="rb" value="${x.buy}"></div><div class="field"><label>Sell</label><input id="rs" value="${x.sell}"></div><div class="field"><label>Change %</label><input id="rc" value="${x.change||0}"></div><button class="btn" onclick="saveRate('${id}')">Save Rate</button>`)}
async function saveRate(id){await updateDoc(doc(db,"rates",id),{buy:Number($("rb").value),sell:Number($("rs").value),change:Number($("rc").value),updatedAt:serverTimestamp()});await log("Rate updated",id);closeModal();toast("Rate updated");render()}
async function addRate(){modal(`<h2>Add Currency</h2><div class="field"><label>Code</label><input id="nc"></div><div class="field"><label>Buy</label><input id="nb" type="number"></div><div class="field"><label>Sell</label><input id="ns" type="number"></div><button class="btn" onclick="saveNewRate()">Add</button>`)}
async function saveNewRate(){let id=$("nc").value.trim().toUpperCase();if(!id)return toast("Enter code");await setDoc(doc(db,"rates",id),{buy:Number($("nb").value),sell:Number($("ns").value),change:0});await log("Currency added",id);closeModal();render()}
async function saveGateway(){await setDoc(doc(db,"settings","public"),{upiId:$("upi").value,upiName:$("upiname").value,upiEnabled:$("upien").value==="true",accountName:$("aname").value,bankName:$("bname").value,accountNumber:$("anum").value,ifsc:$("ifsc").value},{merge:true});await log("Payment gateway updated");toast("Payment settings saved")}
async function saveCharges(){await setDoc(doc(db,"settings","public"),{conversionFee:Number($("fee").value),withdrawalFee:Number($("wfee").value),depositFee:Number($("dfee").value)},{merge:true});await log("Charges updated");toast("Charges saved")}
async function saveSettings(){await setDoc(doc(db,"settings","public"),{siteName:$("site").value,heroTitle:$("heroTitle").value,heroImage:$("hero").value,supportEmail:$("supportEmail").value},{merge:true});await log("System settings updated");toast("Settings saved")}
async function sendNotification(){let uid=$("nid").value.trim(),title=$("ntitle").value,msg=$("nmsg").value;if(!title||!msg)return toast("Fill title and message");if(uid)await addDoc(collection(db,"notifications"),{userId:uid,title,message:msg,type:"SYSTEM",createdAt:serverTimestamp()});else{let u=await getCol("users");for(let x of u)await addDoc(collection(db,"notifications"),{userId:x.id,title,message:msg,type:"SYSTEM",createdAt:serverTimestamp()})}await log("Notification sent");toast("Notification sent")}
async function replyTicket(id){let r=prompt("Reply");if(!r)return;await addDoc(collection(db,"ticketMessages"),{ticketId:id,authorId:admin.uid,message:r,createdAt:serverTimestamp()});await updateDoc(doc(db,"tickets",id),{status:"IN_PROGRESS"});await log("Ticket replied",id);toast("Reply sent")}
async function transferAction(id,status){await updateDoc(doc(db,"transfers",id),{status,processedAt:serverTimestamp(),processedBy:admin.uid});await log(`Transfer ${status}`,id);render()}
function exportData(){Promise.all(["users","wallets","deposits","withdrawals","transactions","rates","notifications","kyc","tickets","activityLogs"].map(getCol)).then(a=>{let o={users:a[0],wallets:a[1],deposits:a[2],withdrawals:a[3],transactions:a[4],rates:a[5],notifications:a[6],kyc:a[7],tickets:a[8],activityLogs:a[9]};let b=new Blob([JSON.stringify(o,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="forexaaaa-backup.json";a.click();URL.revokeObjectURL(u)})}
window.approveDeposit=approveDeposit;window.rejectDeposit=rejectDeposit;window.withdrawAction=withdrawAction;window.kycAction=kycAction;window.kycReject=kycReject;window.editUser=editUser;window.saveUser=saveUser;window.adjustWallet=adjustWallet;window.editRate=editRate;window.saveRate=saveRate;window.addRate=addRate;window.saveNewRate=saveNewRate;window.saveGateway=saveGateway;window.saveCharges=saveCharges;window.saveSettings=saveSettings;window.sendNotification=sendNotification;window.replyTicket=replyTicket;window.transferAction=transferAction;window.exportData=exportData;
onAuthStateChanged(auth,async u=>{admin=u;await render()});
</script>
</body>
</html>
