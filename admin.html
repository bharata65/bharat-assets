<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forexaaa Admin Panel</title><style>
:root{--b:#0757d9;--d:#061b42;--bg:#f4f7fc;--line:#dce5f3;--ok:#10a66a;--red:#e5484d;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:#17233c}.layout{display:flex;min-height:100vh}.side{width:245px;background:var(--d);color:#fff;padding:18px;position:sticky;top:0;height:100vh}.logo{font-size:24px;font-weight:900;margin-bottom:18px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#dbe8ff;margin:3px 0;padding:10px;border-radius:8px}.side button:hover{background:#ffffff15}.main{flex:1;padding:22px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:15px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 18px #163d7810}.metric{font-size:25px;font-weight:900}.muted{color:#667085;font-size:13px}.table{overflow:auto}.row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);min-width:760px}.head{font-weight:900;background:#f5f8fd}.pill{padding:5px 9px;border-radius:99px;background:#eaf1ff;color:var(--b);font-weight:800;font-size:12px}.green{color:var(--ok)}.red{color:var(--red)}button{border:0;border-radius:8px;padding:9px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}button.alt{background:#fff;color:var(--b);border:1px solid #c8d6ec}button.danger{background:var(--red)}input,select,textarea{width:100%;padding:10px;border:1px solid #cdd8eb;border-radius:8px;background:white}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.modal{position:fixed;inset:0;background:#061b4288;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.on{display:flex}.box{background:white;border-radius:16px;padding:20px;width:100%;max-width:650px;max-height:90vh;overflow:auto}.toast{position:fixed;right:15px;bottom:15px;background:#061b42;color:#fff;padding:12px;border-radius:9px;display:none}.toast.on{display:block}@media(max-width:850px){.side{width:68px}.side span{display:none}.main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.side{display:none}}
</style></head><body><div class="layout"><aside class="side"><div class="logo">F<span>or</span></div>
<button onclick="page('dashboard')">▣ <span>Dashboard</span></button><button onclick="page('users')">♙ <span>User Management</span></button><button onclick="page('kyc')">✓ <span>KYC Management</span></button><button onclick="page('wallets')">₹ <span>Wallet Management</span></button><button onclick="page('deposits')">↓ <span>Deposit Management</span></button><button onclick="page('withdrawals')">↑ <span>Withdrawal Management</span></button><button onclick="page('transactions')">≡ <span>Transaction Management</span></button><button onclick="page('currencies')">◎ <span>Currency Management</span></button><button onclick="page('rates')">↗ <span>Rates Management</span></button><button onclick="page('charges')">% <span>Margin & Charges</span></button><button onclick="page('payouts')">↪ <span>Send Money</span></button><button onclick="page('gateways')">▣ <span>Payment Gateways</span></button><button onclick="page('support')">? <span>Support & Tickets</span></button><button onclick="page('notifications')">● <span>Notifications</span></button><button onclick="page('cms')">▤ <span>CMS Management</span></button><button onclick="page('reports')">▥ <span>Reports & Analytics</span></button><button onclick="page('settings')">⚙ <span>System Settings</span></button><button onclick="page('logs')">◷ <span>Activity Logs</span></button><button onclick="page('security')">🔒 <span>Security</span></button><button onclick="page('backup')">⬇ <span>Backup</span></button><button onclick="logout()">⇥ <span>Logout</span></button>
</aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Complete control • Firebase backed</div></div><button onclick="logout()">Logout</button></header><div id="app"></div></main></div><div id="modal" class="modal"><div id="mb" class="box"></div></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,getDocs,query,orderBy,limit,where,serverTimestamp,updateDoc,increment} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCKa0HNQd0kDA8uLP6hNWgkjF70d3wKXbU",authDomain:"bharat-digital-assets.firebaseapp.com",projectId:"bharat-digital-assets",storageBucket:"bharat-digital-assets.firebasestorage.app",messagingSenderId:"451769882363",appId:"1:451769882363:web:f80db52e495d8456d5425e"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let admin=null;
const $=x=>document.getElementById(x),money=n=>"₹ "+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function toast(x){$("toast").textContent=x;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),2500)}
function modal(h){$("mb").innerHTML=h;$("modal").classList.add("on")}function closeModal(){$("modal").classList.remove("on")}window.closeModal=closeModal;
async function isAdmin(u){let s=await getDoc(doc(db,"admins",u.uid));return s.exists()&&s.data().active!==false}
onAuthStateChanged(auth,async u=>{if(!u){login();return}if(!(await isAdmin(u))){alert("This account is not an admin.");signOut(auth);return}admin=u;page("dashboard")});
window.login=()=>modal(`<h2>Admin Login</h2><div class="field"><label>Email</label><input id="em" type="email"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button onclick="doLogin()">Login</button>`);window.doLogin=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value);closeModal()}catch(e){toast(e.message)}};
window.logout=()=>signOut(auth);window.page=async p=>{let titles={dashboard:"Dashboard",users:"User Management",kyc:"KYC Management",wallets:"Wallet Management",deposits:"Deposit Management",withdrawals:"Withdrawal Management",transactions:"Transaction Management",currencies:"Currency Management",rates:"Rates Management",charges:"Margin & Charges",payouts:"Send Money",gateways:"Payment Gateways",support:"Support & Tickets",notifications:"Notifications",cms:"CMS Management",reports:"Reports & Analytics",settings:"System Settings",logs:"Activity Logs",security:"Security",backup:"Backup & Restore"};$("title").textContent=titles[p]||p;let h="";
if(p==="dashboard"){let u=await getDocs(collection(db,"users")),d=await getDocs(collection(db,"deposits")),w=await getDocs(collection(db,"withdrawals"));let total=0;u.forEach(x=>total+=Number(x.data().wallet||0));h=`<div class="grid"><div class="card"><div class="muted">Total Users</div><div class="metric">${u.size}</div></div><div class="card"><div class="muted">Wallet Balance</div><div class="metric">${money(total)}</div></div><div class="card"><div class="muted">Deposits</div><div class="metric">${d.size}</div></div><div class="card"><div class="muted">Withdrawals</div><div class="metric">${w.size}</div></div></div><div class="card"><h3>Quick Actions</h3><button onclick="page('deposits')">Review Deposits</button> <button onclick="page('withdrawals')">Review Withdrawals</button> <button onclick="page('settings')">UPI / Banner Settings</button> <button onclick="page('rates')">Update Rates</button></div>`}
else if(p==="users")h=await usersPage();
else if(p==="kyc")h=await kycPage();
else if(p==="wallets")h=await walletsPage();
else if(p==="deposits")h=await depositsPage();
else if(p==="withdrawals")h=await withdrawalsPage();
else if(p==="transactions")h=await transactionsPage();
else if(p==="rates")h=await ratesPage();
else if(p==="currencies")h=await currenciesPage();
else if(p==="settings")h=await settingsPage();
else if(p==="gateways")h=await settingsPage();
else if(p==="cms")h=await cmsPage();
else if(p==="notifications")h=await notificationsPage();
else h=`<div class="card"><h3>${titles[p]}</h3><p class="muted">Module ready for Firebase data. Use Deposit, Withdrawal, Users, Rates, Settings and CMS modules for live controls.</p></div>`;
$("app").innerHTML=h};
async function usersPage(){let q=await getDocs(collection(db,"users")),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.name||"-"}</span><span>${r.email||"-"}</span><span>${money(r.wallet)}</span><span class="pill">${r.status||"Active"}</span><button onclick='editUser(${JSON.stringify(x.id)})'>View</button></div>`});return `<div class="card"><div class="table"><div class="row head"><span>Name</span><span>Email</span><span>Wallet</span><span>Status</span><span>Action</span></div>${rows||"No users"}</div></div>`}
window.editUser=async id=>{let s=(await getDoc(doc(db,"users",id))).data();modal(`<h2>User</h2><p><b>${s.email}</b></p><div class="field"><label>Name</label><input id="un" value="${s.name||""}"></div><div class="field"><label>Wallet</label><input id="uw" type="number" value="${s.wallet||0}"></div><div class="field"><label>Status</label><select id="us"><option ${s.status==="Active"?"selected":""}>Active</option><option ${s.status==="Blocked"?"selected":""}>Blocked</option></select></div><button onclick="saveUser('${id}')">Save</button> <button class="alt" onclick="closeModal()">Close</button>`)};window.saveUser=async id=>{await updateDoc(doc(db,"users",id),{name:$("un").value,wallet:+$("uw").value,status:$("us").value});closeModal();toast("User updated");page("users")};
async function depositsPage(){let q=await getDocs(query(collection(db,"deposits"),orderBy("createdAt","desc"),limit(100))),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.email||r.uid}</span><span>${money(r.amount)}</span><span>${r.method||"UPI"}</span><span class="pill">${r.status}</span><span>${r.status==="Pending"?`<button onclick="reviewDeposit('${x.id}','approve')">Approve</button> <button class="danger" onclick="reviewDeposit('${x.id}','reject')">Reject</button>`:`<span class="muted">Reviewed</span>`}</span></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>Amount</span><span>Method</span><span>Status</span><span>Action</span></div>${rows||"No deposits"}</div></div>`}
window.reviewDeposit=async(id,act)=>{let ref=doc(db,"deposits",id),s=await getDoc(ref);if(!s.exists())return;let r=s.data();if(r.status!=="Pending")return toast("Already reviewed");if(act==="approve"){await updateDoc(ref,{status:"Approved",reviewedAt:serverTimestamp(),reviewedBy:admin.uid});await updateDoc(doc(db,"users",r.uid),{wallet:increment(Number(r.amount))});await addDoc(collection(db,"transactions"),{uid:r.uid,type:"Deposit",amount:r.amount,status:"Completed",source:id,createdAt:serverTimestamp()});await addDoc(collection(db,"notifications"),{uid:r.uid,title:"Deposit approved",message:`${money(r.amount)} added to your wallet.`,createdAt:serverTimestamp(),read:false})}else{await updateDoc(ref,{status:"Rejected",reviewedAt:serverTimestamp(),reviewedBy:admin.uid});await addDoc(collection(db,"notifications"),{uid:r.uid,title:"Deposit rejected",message:"Your deposit request was rejected by admin.",createdAt:serverTimestamp(),read:false})}toast("Deposit updated");page("deposits")};
async function withdrawalsPage(){let q=await getDocs(query(collection(db,"withdrawals"),orderBy("createdAt","desc"),limit(100))),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.email||r.uid}</span><span>${money(r.amount)}</span><span>${r.to||"-"}</span><span class="pill">${r.status}</span><span>${r.status==="Pending"?`<button onclick="reviewWithdrawal('${x.id}','approve')">Approve</button> <button class="danger" onclick="reviewWithdrawal('${x.id}','reject')">Reject</button>`:"Reviewed"}</span></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>Amount</span><span>Destination</span><span>Status</span><span>Action</span></div>${rows||"No withdrawals"}</div></div>`}
window.reviewWithdrawal=async(id,act)=>{let ref=doc(db,"withdrawals",id),s=await getDoc(ref),r=s.data();if(r.status!=="Pending")return;let u=await getDoc(doc(db,"users",r.uid)),bal=Number(u.data()?.wallet||0);if(act==="approve"){if(bal<r.amount)return toast("Insufficient wallet balance");await updateDoc(doc(db,"users",r.uid),{wallet:increment(-Number(r.amount))});await updateDoc(ref,{status:"Approved",reviewedAt:serverTimestamp(),reviewedBy:admin.uid});await addDoc(collection(db,"transactions"),{uid:r.uid,type:"Withdrawal",amount:r.amount,status:"Completed",source:id,createdAt:serverTimestamp()})}else await updateDoc(ref,{status:"Rejected",reviewedAt:serverTimestamp(),reviewedBy:admin.uid});toast("Withdrawal updated");page("withdrawals")};
async function walletsPage(){let q=await getDocs(collection(db,"users")),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.email}</span><span>${money(r.wallet)}</span><span>${r.kycStatus||"Pending"}</span><span>${r.status||"Active"}</span><button onclick="editUser('${x.id}')">Manage</button></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>Balance</span><span>KYC</span><span>Status</span><span>Action</span></div>${rows}</div></div>`}
async function kycPage(){let q=await getDocs(collection(db,"users")),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.email}</span><span>${r.kycStatus||"Pending"}</span><span>${r.kycDocumentUrl?"Document":"No document"}</span><span>${r.status||"Active"}</span><button onclick="setKyc('${x.id}','Verified')">Verify</button></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>KYC</span><span>Document</span><span>Status</span><span>Action</span></div>${rows}</div></div>`}
window.setKyc=async(id,status)=>{await updateDoc(doc(db,"users",id),{kycStatus:status});toast("KYC updated");page("kyc")};
async function transactionsPage(){let q=await getDocs(query(collection(db,"transactions"),orderBy("createdAt","desc"),limit(100))),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.uid}</span><span>${r.type}</span><span>${money(r.amount)}</span><span>${r.status}</span><span>${x.id}</span></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>Type</span><span>Amount</span><span>Status</span><span>ID</span></div>${rows}</div></div>`}
async function ratesPage(){let q=await getDocs(collection(db,"rates")),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.currency||x.id}</span><span>${r.buy||""}</span><span>${r.sell||""}</span><span>${r.status||"Active"}</span><button onclick="editRate('${x.id}')">Edit</button></div>`});return `<div class="card"><button onclick="editRate('new')">Add Rate</button><div class="table" style="margin-top:10px"><div class="row head"><span>Currency</span><span>Buy</span><span>Sell</span><span>Status</span><span>Action</span></div>${rows}</div></div>`}
window.editRate=async id=>{let r=id==="new"?{}:(await getDoc(doc(db,"rates",id))).data()||{};modal(`<h2>Rate</h2><div class="field"><label>Currency</label><input id="rc" value="${r.currency||""}"></div><div class="field"><label>Buy</label><input id="rb" type="number" step="0.0001" value="${r.buy||""}"></div><div class="field"><label>Sell</label><input id="rs" type="number" step="0.0001" value="${r.sell||""}"></div><button onclick="saveRate('${id}')">Save</button>`)};window.saveRate=async id=>{let c=$("rc").value.trim().toUpperCase(),data={currency:c,buy:+$("rb").value,sell:+$("rs").value,status:"Active",updatedAt:serverTimestamp()};await setDoc(doc(db,"rates",id==="new"?c:id),data,{merge:true});closeModal();page("rates")};
async function currenciesPage(){return `<div class="card"><h3>Currency Management</h3><p class="muted">Add currencies through the Rates module. Each currency is stored in <b>rates</b> collection and shown on user Live Rates.</p><button onclick="page('rates')">Manage Rates</button></div>`}
async function settingsPage(){let s=(await getDoc(doc(db,"config","public"))).data()||{};return `<div class="card"><h3>UPI / Public Settings</h3><div class="field"><label>UPI ID</label><input id="upi" value="${s.upiId||""}"></div><div class="field"><label>UPI Display Name</label><input id="upin" value="${s.upiName||"Forexaaa"}"></div><div class="field"><label>Minimum Deposit</label><input id="min" type="number" value="${s.minDeposit||100}"></div><div class="field"><label>Maximum Deposit</label><input id="max" type="number" value="${s.maxDeposit||100000}"></div><div class="field"><label>Home Banner Image URL</label><input id="ban" value="${s.bannerUrl||""}"><small class="muted">Upload your banner to Firebase Storage and paste its download URL here. Recommended 1600×500 or 1600×600.</small></div><button onclick="saveSettings()">Save Settings</button></div><div class="card" style="margin-top:14px"><h3>Manual UPI Flow</h3><p>Users receive a QR generated from the current UPI ID + amount. “I Have Paid” creates a Pending deposit. Admin approval credits the wallet and creates a transaction + notification.</p></div>`}
window.saveSettings=async()=>{await setDoc(doc(db,"config","public"),{upiId:$("upi").value.trim(),upiName:$("upin").value.trim(),minDeposit:+$("min").value,maxDeposit:+$("max").value,bannerUrl:$("ban").value.trim(),updatedAt:serverTimestamp()},{merge:true});toast("Settings saved")};
async function cmsPage(){let s=(await getDoc(doc(db,"config","public"))).data()||{};return `<div class="card"><h3>CMS / Home Banner</h3><p class="muted">Banner is admin-controlled. Upload the image manually in Firebase Storage, then paste the download URL below.</p><div class="field"><label>Banner URL</label><input id="cmsban" value="${s.bannerUrl||""}"></div><button onclick="saveCms()">Publish Banner</button><div style="margin-top:15px">${s.bannerUrl?`<img src="${s.bannerUrl}" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px">`:"No banner published."}</div></div>`}
window.saveCms=async()=>{await setDoc(doc(db,"config","public"),{bannerUrl:$("cmsban").value.trim(),updatedAt:serverTimestamp()},{merge:true});toast("Banner published");page("cms")};
async function notificationsPage(){let q=await getDocs(query(collection(db,"notifications"),orderBy("createdAt","desc"),limit(50))),rows="";q.forEach(x=>{let r=x.data();rows+=`<div class="row"><span>${r.uid}</span><span>${r.title||""}</span><span>${r.message||""}</span><span>${r.read?"Read":"Unread"}</span><span>${x.id}</span></div>`});return `<div class="card"><div class="table"><div class="row head"><span>User</span><span>Title</span><span>Message</span><span>Status</span><span>ID</span></div>${rows}</div></div>`}
</script></body></html>
